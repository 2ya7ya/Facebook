<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Social Media</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;min-height:100%;background:#fff;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}body{max-width:430px;margin:0 auto}button,input{font:inherit}.page{display:none;min-height:100vh;background:#fff}.page.active{display:block}.topbar{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#fff;position:sticky;top:0;z-index:10;border-bottom:1px solid #f0f2f5}.left{display:flex;align-items:center;min-width:0}.back-btn{width:40px;height:40px;border:0;background:transparent;display:flex;align-items:center;justify-content:flex-start;padding:0;margin-right:12px;cursor:pointer}.back-icon{width:17px;height:17px;border-left:3px solid #111;border-bottom:3px solid #111;transform:rotate(45deg);border-radius:1px;margin-left:4px}.title{font-size:23px;line-height:30px;font-weight:800;white-space:nowrap;margin:0}.done-btn{border:0;background:transparent;color:#1878f3;font-size:17px;font-weight:700;padding:8px 0;cursor:pointer}.done-btn:disabled{color:#bcc0c4;cursor:default}.content{padding:8px 16px 90px}.social-list{display:flex;flex-direction:column}.social-platform{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid #f0f2f5}.platform-icon,.tag-icon{border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;flex-shrink:0}.platform-icon{width:38px;height:38px;font-size:12px}.platform-info{flex:1;min-width:0}.platform-name{margin:0;font-size:15px;font-weight:700;color:#111827}.platform-input{display:block;width:100%;border:0;outline:0;background:transparent;margin-top:3px;padding:2px 0;font-size:14px;color:#65676b}.platform-input::placeholder{color:#9ca3af}.add-btn{min-width:58px;height:34px;border:0;border-radius:18px;background:#e7f3ff;color:#1878f3;font-size:14px;font-weight:700;cursor:pointer;padding:0 12px}.add-btn:disabled{background:#f0f2f5;color:#bcc0c4}.selected-count{position:fixed;bottom:18px;right:18px;background:#1878f3;color:#fff;padding:9px 13px;border-radius:18px;font-size:13px;font-weight:800;display:none;z-index:20}.selected-count.show{display:block}.center-title{position:absolute;left:70px;right:70px;text-align:center;font-size:20px;font-weight:800;pointer-events:none}.spacer{width:40px}.add-more-wrap{padding:13px 16px 12px}.add-more-btn{width:100%;border:0;background:#e7f3ff;border-radius:10px;padding:12px;font-size:15px;font-weight:700;color:#1878f3}.social-display{padding:0 16px 96px}.social-empty{text-align:center;color:#65676b;padding:62px 24px;font-size:15px}.social-tag{display:grid;grid-template-columns:38px minmax(0,1fr) auto;align-items:center;gap:11px;border-bottom:1px solid #f0f2f5;padding:13px 0}.tag-icon{width:36px;height:36px;font-size:11px}.tag-copy{min-width:0}.tag-platform{font-size:15px;font-weight:700;color:#111827}.tag-handle{font-size:14px;color:#65676b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}.tag-actions{display:flex;align-items:center;gap:5px}.tag-action{border:0;background:#f0f2f5;color:#1c1e21;border-radius:18px;height:34px;padding:0 12px;font-size:13px;font-weight:700}.tag-action.delete{width:34px;padding:0;font-size:20px;color:#65676b}.save-btn{position:fixed;left:16px;right:16px;bottom:16px;border:0;border-radius:10px;background:#1878f3;color:#fff;height:46px;font-size:16px;font-weight:800;max-width:398px;margin:0 auto;cursor:pointer}.save-btn:disabled{background:#e4e6eb;color:#bcc0c4}.edit-note{display:none;margin:0 16px 4px;padding:10px 12px;border-radius:9px;background:#f0f2f5;color:#65676b;font-size:13px}.edit-note.show{display:block}
</style>
</head>
<body>
<div id="add-social-page" class="page">
<header class="topbar"><div class="left"><button id="back-btn" class="back-btn" aria-label="Back"><span class="back-icon"></span></button><h1 id="add-title" class="title">Add social media</h1></div><button id="done-btn" class="done-btn" disabled>Done</button></header>
<div id="edit-note" class="edit-note">Choose the account type and save only this account.</div>
<main class="content"><div id="social-list" class="social-list"></div></main><div id="selected-count" class="selected-count"><span id="count-text">0 accounts</span></div>
</div>
<div id="social-page" class="page">
<header class="topbar"><button id="close-btn" class="back-btn merged-unified-x" aria-label="Close" type="button" style="font-size:30px;font-weight:300;color:#1c1e21;width:40px;justify-content:flex-start">&times;</button><div class="center-title">Social Media</div><div class="spacer"></div></header>
<div class="add-more-wrap"><button id="add-more-btn" class="add-more-btn" type="button">+ Add social media account</button></div><div id="social-display" class="social-display"></div><button id="save-btn" class="save-btn" type="button">Save</button>
</div>
<script>
(function(){
const platforms=[{"name": "Twitter", "color": "#050505", "placeholder": "@username", "short": "𝕏"}, {"name": "Instagram", "color": "#E4405F", "placeholder": "@username", "short": "IG"}, {"name": "Facebook", "color": "#1877F2", "placeholder": "username", "short": "f"}, {"name": "LinkedIn", "color": "#0A66C2", "placeholder": "username", "short": "in"}, {"name": "TikTok", "color": "#000000", "placeholder": "@username", "short": "♪"}, {"name": "YouTube", "color": "#FF0000", "placeholder": "@channel", "short": "▶"}, {"name": "Snapchat", "color": "#FFFC00", "placeholder": "username", "short": "SC"}, {"name": "Discord", "color": "#5865F2", "placeholder": "username#0000", "short": "D"}, {"name": "Twitch", "color": "#9146FF", "placeholder": "username", "short": "Tw"}, {"name": "Reddit", "color": "#FF4500", "placeholder": "u/username", "short": "R"}, {"name": "GitHub", "color": "#181717", "placeholder": "username", "short": "GH"}, {"name": "Telegram", "color": "#0088cc", "placeholder": "@username", "short": "TG"}, {"name": "WhatsApp", "color": "#25D366", "placeholder": "phone number", "short": "WA"}, {"name": "Pinterest", "color": "#E60023", "placeholder": "username", "short": "P"}, {"name": "Threads", "color": "#000000", "placeholder": "@username", "short": "@"}, {"name": "Behance", "color": "#1769FF", "placeholder": "username", "short": "Be"}, {"name": "Dribbble", "color": "#EA4C89", "placeholder": "username", "short": "Db"}, {"name": "Medium", "color": "#000000", "placeholder": "@username", "short": "M"}, {"name": "Vimeo", "color": "#1AB7EA", "placeholder": "username", "short": "V"}, {"name": "Tumblr", "color": "#36465D", "placeholder": "username", "short": "T"}, {"name": "Skype", "color": "#00AFF0", "placeholder": "username", "short": "S"}, {"name": "Slack", "color": "#E01E5A", "placeholder": "@username", "short": "SL"}, {"name": "Flickr", "color": "#0063DC", "placeholder": "username", "short": "Fl"}, {"name": "ArtStation", "color": "#13AFF0", "placeholder": "username", "short": "AS"}, {"name": "DeviantArt", "color": "#05CC47", "placeholder": "username", "short": "DA"}, {"name": "Quora", "color": "#B92B27", "placeholder": "username", "short": "Q"}, {"name": "Stack Overflow", "color": "#F48024", "placeholder": "username", "short": "SO"}, {"name": "Line", "color": "#00B900", "placeholder": "LINE ID", "short": "LN"}, {"name": "WeChat", "color": "#09B83E", "placeholder": "WeChat ID", "short": "WC"}, {"name": "Signal", "color": "#3A76F0", "placeholder": "username", "short": "SG"}];
const platformByName=new Map(platforms.map(function(p){return [p.name.toLowerCase(),p];}));
const list=document.getElementById('social-list'),done=document.getElementById('done-btn'),badge=document.getElementById('selected-count'),countText=document.getElementById('count-text'),addPage=document.getElementById('add-social-page'),confirmPage=document.getElementById('social-page'),display=document.getElementById('social-display'),save=document.getElementById('save-btn');
let entries=[],pending=[],editingId='';
function uid(){return 'social-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];});}
function normalizeEntry(raw,index){const name=String(raw&&raw.name||raw&&raw.platform||'').trim();const handle=String(raw&&raw.handle||raw&&raw.value||'').trim();if(!name||!handle)return null;const p=platformByName.get(name.toLowerCase())||{name:name,color:'#65676b',short:name.slice(0,2).toUpperCase(),placeholder:'username'};return {id:String(raw&&raw.id||'saved-'+index+'-'+uid()),name:p.name,color:p.color,short:p.short,handle:handle};}
function loadExisting(){try{const all=JSON.parse(localStorage.getItem('mergedProfileData')||'{}');const record=all['add_social_media.html']||{};if(Array.isArray(record.details))entries=record.details.map(normalizeEntry).filter(Boolean);if(!entries.length&&Array.isArray(record.values))entries=record.values.map(function(value,index){const match=String(value||'').match(/^\s*([^:]+)\s*:\s*(.+)$/);return match?normalizeEntry({name:match[1],handle:match[2]},index):null;}).filter(Boolean);}catch(error){entries=[];}}
function updateDone(){const n=pending.length;done.disabled=n===0;badge.classList.toggle('show',n>0);countText.textContent=n+' account'+(n===1?'':'s')+' ready';}
function resetAddMode(){pending=[];editingId='';document.getElementById('add-title').textContent='Add social media';document.getElementById('edit-note').classList.remove('show');renderPlatforms();}
function renderPlatforms(){list.replaceChildren();platforms.forEach(function(p){const row=document.createElement('div');row.className='social-platform';row.innerHTML='<div class="platform-icon" style="background:'+p.color+'">'+esc(p.short)+'</div><div class="platform-info"><p class="platform-name">'+esc(p.name)+'</p><input class="platform-input" placeholder="'+esc(p.placeholder)+'" autocomplete="off"></div><button class="add-btn" type="button">'+(editingId?'Save':'Add')+'</button>';const input=row.querySelector('input'),button=row.querySelector('button');if(editingId){const current=entries.find(function(item){return item.id===editingId;});if(current&&current.name===p.name)input.value=current.handle;}
function sync(){button.disabled=!input.value.trim();}input.addEventListener('input',sync);button.addEventListener('click',function(){const handle=input.value.trim();if(!handle)return input.focus();if(editingId){const index=entries.findIndex(function(item){return item.id===editingId;});if(index>=0)entries[index]={id:editingId,name:p.name,color:p.color,short:p.short,handle:handle};editingId='';showConfirm();return;}pending.push({id:uid(),name:p.name,color:p.color,short:p.short,handle:handle});input.value='';sync();updateDone();});sync();list.appendChild(row);});updateDone();}
function showAdd(){confirmPage.classList.remove('active');addPage.classList.add('active');renderPlatforms();}
function showConfirm(){if(pending.length){entries=entries.concat(pending);pending=[];}display.replaceChildren();if(!entries.length){const empty=document.createElement('div');empty.className='social-empty';empty.textContent='No social media accounts have been added yet.';display.appendChild(empty);}entries.forEach(function(data){const tag=document.createElement('div');tag.className='social-tag';tag.dataset.id=data.id;tag.innerHTML='<div class="tag-icon" style="background:'+data.color+'">'+esc(data.short)+'</div><div class="tag-copy"><div class="tag-platform">'+esc(data.name)+'</div><div class="tag-handle">'+esc(data.handle)+'</div></div><div class="tag-actions"><button class="tag-action" type="button" data-social-action="edit">Edit</button><button class="tag-action delete" type="button" data-social-action="delete" aria-label="Delete">×</button></div>';display.appendChild(tag);});save.disabled=false;addPage.classList.remove('active');confirmPage.classList.add('active');updateDone();}
function editEntry(id){const current=entries.find(function(item){return item.id===id;});if(!current)return;editingId=id;pending=[];document.getElementById('add-title').textContent='Edit social media';document.getElementById('edit-note').classList.add('show');showAdd();}
function persist(){try{const all=JSON.parse(localStorage.getItem('mergedProfileData')||'{}');all['add_social_media.html']={values:entries.map(function(item){return item.name+': '+item.handle;}),details:entries.map(function(item){return {id:item.id,name:item.name,handle:item.handle};}),updatedAt:Date.now()};localStorage.setItem('mergedProfileData',JSON.stringify(all));window.dispatchEvent(new CustomEvent('profiledetailsloaded',{detail:{editorData:all}}));}catch(error){}try{parent.openPage('edit_profile.html',false);}catch(error){location.href='edit_profile.html';}}
function closeToEditor(){try{parent.openPage('edit_profile.html',false);}catch(error){history.back();}}
document.getElementById('back-btn').addEventListener('click',function(event){event.preventDefault();if(editingId){editingId='';showConfirm();}else if(entries.length||pending.length)showConfirm();else closeToEditor();});done.addEventListener('click',function(event){event.preventDefault();if(!done.disabled)showConfirm();});document.getElementById('add-more-btn').addEventListener('click',function(event){event.preventDefault();resetAddMode();showAdd();});document.getElementById('close-btn').addEventListener('click',function(event){event.preventDefault();closeToEditor();});save.addEventListener('click',function(event){event.preventDefault();if(!save.disabled)persist();});display.addEventListener('click',function(event){const button=event.target.closest('[data-social-action]');if(!button)return;const row=button.closest('.social-tag'),id=row&&row.dataset.id;if(button.dataset.socialAction==='edit')editEntry(id);else if(button.dataset.socialAction==='delete'){entries=entries.filter(function(item){return item.id!==id;});showConfirm();}});
loadExisting();if(entries.length)showConfirm();else{resetAddMode();showAdd();}
})();
</script>
</body>
</html>
