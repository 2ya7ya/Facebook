<!DOCTYPE html>
<html lang="en">
<head><script>window.alert=function(){};</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Links</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
        }
        .page {
            display: none;
        }
        .page.active {
            display: block;
        }
        .input-box {
            background-color: #f0f2f5;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 12px;
            border: 1px solid #e5e7eb;
        }
        .input-box input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            font-size: 14px;
            font-family: inherit;
        }
        .input-box input::placeholder {
            color: #9ca3af;
        }
        .add-link-btn {
            width: 100%;
            background-color: #1878F3;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .add-link-btn:hover {
            background-color: #0d5ecf;
        }
        .link-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 0;
            border-bottom: 1px solid #f0f2f5;
        }
        .link-item:last-child {
            border-bottom: none;
        }
        .link-icon {
            width: 48px;
            height: 48px;
            border-radius: 6px;
            flex-shrink: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 12px;
        }
        .link-info {
            flex: 1;
            min-width: 0;
        }
        .link-title {
            font-size: 14px;
            font-weight: bold;
            margin: 0;
            word-break: break-word;
        }
        .link-url {
            font-size: 12px;
            color: #65676b;
            margin: 2px 0 0 0;
            word-break: break-all;
        }
        .add-btn {
            color: #9ca3af;
            font-size: 20px;
            cursor: pointer;
            transition: color 0.2s;
            border: none;
            background: none;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .add-btn:hover {
            color: #4b5563;
        }
        .add-btn.active {
            color: #0a66c2;
        }
        .selected-count {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #0a66c2;
            color: white;
            padding: 12px 16px;
            border-radius: 20px;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            display: none;
            z-index: 5;
        }
        .selected-count.show {
            display: block;
        }
        .link-tag {
            display: inline-block;
            background-color: #f0f2f5;
            padding: 6px 10px;
            border-radius: 16px;
            margin: 3px;
            font-size: 12px;
            font-weight: 500;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .link-tag .remove-btn {
            margin-left: 6px;
            cursor: pointer;
            color: #65676b;
        }
        .link-tag .remove-btn:hover {
            color: #000;
        }
        .link-tag a {
            color: #0a66c2;
            text-decoration: none;
        }
        .link-tag a:hover {
            text-decoration: underline;
        }
        .add-more-btn {
            width: 100%;
            background-color: #f0f2f5;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .add-more-btn:hover {
            background-color: #e4e6eb;
        }
        .save-btn {
            width: 100%;
            background-color: #1878F3;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            position: fixed;
            bottom: 16px;
            left: 16px;
            right: 16px;
            max-width: calc(100% - 32px);
        }
        .save-btn:hover {
            background-color: #0d5ecf;
        }
        .links-container {
            padding-bottom: 80px;
        }
        .links-list {
            display: flex;
            flex-direction: column;
            gap: 0;
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #65676b;
        }
        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        #done-btn:disabled {
            color: #bcc0c4 !important;
            cursor: default !important;
            opacity: 1 !important;
            pointer-events: none !important;
        }
    </style>

</head>
<body class="max-w-md mx-auto min-h-screen pb-20">
    <!-- Add Links Page -->
    <div id="add-links-page" class="page active">
        <!-- Header -->
        <header class="p-4 flex items-center justify-between">
            <div class="flex items-center">
                <button class="text-2xl mr-4">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                <h1 class="text-2xl font-bold">Add links</h1>
            </div>
            <button id="done-btn" class="text-lg font-bold text-blue-600 hover:text-blue-700" disabled aria-disabled="true">
                Done
            </button>
        </header>

        <!-- Input Section -->
        <div class="px-4 mb-6">
            <div class="input-box">
                <input 
                    type="text" 
                    id="url-input"
                    placeholder="Enter URL" 
                >
            </div>
            <div class="input-box">
                <input 
                    type="text" 
                    id="title-input"
                    placeholder="Enter title" 
                >
            </div>
            <button id="add-link-btn" class="add-link-btn">Add Link</button>
        </div>

        <!-- Links List -->
        <div class="px-4">
            <div id="links-list" class="links-list"></div>
            <div id="empty-state" class="empty-state">
                <div class="empty-state-icon">
                    <i class="fa-solid fa-link"></i>
                </div>
                <p>Add links to get started</p>
            </div>
        </div>

        <!-- Selected Count Badge -->
        <div id="selected-count" class="selected-count">
            <span id="count-text">0 selected</span>
        </div>
    </div>

    <!-- Links Confirmation Page -->
    <div id="links-page" class="page">
        <!-- Header -->
        <header class="p-4 flex items-center justify-between">
            <button id="close-btn" class="text-2xl">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <h1 class="text-2xl font-bold">Links</h1>
            <div style="width: 24px;"></div>
        </header>

        <!-- Add More Button -->
        <div class="px-4 mb-6">
            <button id="add-more-btn" class="add-more-btn">
                <i class="fa-solid fa-plus"></i>
                Add more
            </button>
        </div>

        <!-- Links Display -->
        <div class="px-4 links-container" id="links-display">
            <!-- Selected links will be displayed here -->
        </div>

        <!-- Save Button -->
        <button id="save-btn" class="save-btn">Save</button>
    </div>

    <script>
        const linksList = document.getElementById('links-list');
        const urlInput = document.getElementById('url-input');
        const titleInput = document.getElementById('title-input');
        const addLinkBtn = document.getElementById('add-link-btn');
        const doneBtn = document.getElementById('done-btn');
        const selectedCountBadge = document.getElementById('selected-count');
        const countText = document.getElementById('count-text');
        const addLinksPage = document.getElementById('add-links-page');
        const linksPage = document.getElementById('links-page');
        const linksDisplay = document.getElementById('links-display');
        const emptyState = document.getElementById('empty-state');
        
        let selectedLinks = new Set();
        let selectedLinksData = new Map();
        let allLinks = [];

        function updateSelectedCount() {
            if (selectedLinks.size > 0) {
                countText.textContent = `${selectedLinks.size} selected`;
                selectedCountBadge.classList.add('show');
                doneBtn.disabled = false;
                doneBtn.setAttribute('aria-disabled', 'false');
            } else {
                selectedCountBadge.classList.remove('show');
                doneBtn.disabled = true;
                doneBtn.setAttribute('aria-disabled', 'true');
            }
        }

        function toggleLink(linkUrl, linkData, button) {
            if (selectedLinks.has(linkUrl)) {
                selectedLinks.delete(linkUrl);
                selectedLinksData.delete(linkUrl);
                button.classList.remove('active');
                button.innerHTML = '<i class="fa-solid fa-circle-plus"></i>';
            } else {
                selectedLinks.add(linkUrl);
                selectedLinksData.set(linkUrl, linkData);
                button.classList.add('active');
                button.innerHTML = '<i class="fa-solid fa-circle-check"></i>';
            }
            updateSelectedCount();
        }

        function renderLinks(links) {
            linksList.innerHTML = '';
            const colors = [
                'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
                'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)',
                'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)',
                'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)',
                'linear-gradient(135deg, #fa709a 0%, #fee140 100%)',
                'linear-gradient(135deg, #30cfd0 0%, #330867 100%)',
                'linear-gradient(135deg, #a8edea 0%, #fed6e3 100%)',
                'linear-gradient(135deg, #ff9a56 0%, #ff6b6b 100%)',
                'linear-gradient(135deg, #2e2e78 0%, #662d8c 100%)',
                'linear-gradient(135deg, #ffa400 0%, #ff6b6b 100%)',
                'linear-gradient(135deg, #26c6da 0%, #00bcd4 100%)',
                'linear-gradient(135deg, #9c27b0 0%, #673ab7 100%)',
                'linear-gradient(135deg, #ff7e5f 0%, #feb47b 100%)',
                'linear-gradient(135deg, #4158d0 0%, #c850c0 100%)',
                'linear-gradient(135deg, #0093e9 0%, #80d0c7 100%)',
                'linear-gradient(135deg, #fa44cd 0%, #8844ff 100%)',
                'linear-gradient(135deg, #ffa751 0%, #ffe259 100%)',
                'linear-gradient(135deg, #52c234 0%, #061700 100%)',
                'linear-gradient(135deg, #ff6b9d 0%, #c06c84 100%)',
                'linear-gradient(135deg, #6bcf7f 0%, #4a90e2 100%)',
                'linear-gradient(135deg, #ff6348 0%, #ffb347 100%)',
            ];

            if (links.length === 0) {
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';

            links.forEach((link, index) => {
                const item = document.createElement('div');
                item.className = 'link-item';
                const isSelected = selectedLinks.has(link.url);
                const buttonClass = isSelected ? 'add-btn active' : 'add-btn';
                const iconClass = isSelected ? 'fa-solid fa-circle-check' : 'fa-solid fa-circle-plus';
                const bgColor = colors[index % colors.length];
                const initials = link.title.substring(0, 2).toUpperCase();
                
                item.innerHTML = `
                    <div class="link-icon" style="background: ${bgColor};">${initials}</div>
                    <div class="link-info">
                        <p class="link-title">${link.title}</p>
                        <p class="link-url">${link.url}</p>
                    </div>
                    <button class="${buttonClass}">
                        <i class="${iconClass}"></i>
                    </button>
                `;
                
                const button = item.querySelector('button');
                button.addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleLink(link.url, link, button);
                });
                
                linksList.appendChild(item);
            });
        }

        function displaySelectedLinks() {
            linksDisplay.innerHTML = '';
            selectedLinks.forEach(linkUrl => {
                const linkData = selectedLinksData.get(linkUrl);
                const tag = document.createElement('div');
                tag.className = 'link-tag';
                tag.innerHTML = `
                    <a href="${linkUrl}" target="_blank" rel="noopener noreferrer">${linkData.title}</a>
                    <span class="remove-btn">×</span>
                `;
                tag.querySelector('.remove-btn').addEventListener('click', () => {
                    selectedLinks.delete(linkUrl);
                    selectedLinksData.delete(linkUrl);
                    displaySelectedLinks();
                });
                linksDisplay.appendChild(tag);
            });
        }

        function showPage(page) {
            addLinksPage.classList.remove('active');
            linksPage.classList.remove('active');
            page.classList.add('active');
        }

        // Add link button handler
        addLinkBtn.addEventListener('click', () => {
            const url = urlInput.value.trim();
            const title = titleInput.value.trim();
            
            if (!url || !title) {
                alert('Please enter both URL and title');
                return;
            }

            // Validate URL
            try {
                new URL(url);
                const linkData = {
                    title: title,
                    url: url
                };
                
                if (!selectedLinks.has(url)) {
                    selectedLinks.add(url);
                    selectedLinksData.set(url, linkData);
                    allLinks.push(linkData);
                    updateSelectedCount();
                    urlInput.value = '';
                    titleInput.value = '';
                    renderLinks(allLinks);
                } else {
                    alert('This link is already added');
                }
            } catch (e) {
                alert('Please enter a valid URL');
            }
        });

        // Enter key to add link
        titleInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addLinkBtn.click();
            }
        });

        // Done button handler
        document.getElementById('done-btn').addEventListener('click', () => {
            if (selectedLinks.size > 0) {
                displaySelectedLinks();
                showPage(linksPage);
            } else {
                alert('Please add at least one link');
            }
        });

        // Close button handler
        document.getElementById('close-btn').addEventListener('click', () => {
            showPage(addLinksPage);
        });

        // Add more button handler
        document.getElementById('add-more-btn').addEventListener('click', () => {
            showPage(addLinksPage);
        });

        // Save button handler
        document.getElementById('save-btn').addEventListener('click', () => {
            const linksList = Array.from(selectedLinks).join(', ');
            alert(`Links saved: ${linksList}`);
        });

        // Initialize
        renderLinks(allLinks);
        updateSelectedCount();
    </script>
</body>
</html>
