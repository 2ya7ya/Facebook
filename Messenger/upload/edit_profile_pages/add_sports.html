    <title>Add Sports</title>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
        }
        .search-container {
            background-color: #f0f2f5;
            border-radius: 20px;
        }
        .sport-item {
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
        }
        .sport-item:active {
            background-color: #f0f2f5;
        }
        .sport-image {
            width: 48px;
            height: 48px;
            border-radius: 6px;
            object-fit: cover;
            flex-shrink: 0;
            background-color: #e4e6eb;
        }
        .sport-info {
            flex: 1;
            min-width: 0;
        }
        .sport-title {
            font-size: 14px;
            font-weight: bold;
            margin: 0;
        }
        .sport-meta {
            font-size: 12px;
            color: #65676b;
            margin: 2px 0 0 0;
        }
        .add-btn {
            color: #9ca3af;
            font-size: 20px;
            cursor: pointer;
            transition: color 0.2s;
            border: none;
            background: none;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .add-btn:hover {
            color: #4b5563;
        }
        .add-btn.active {
            color: #0a66c2;
        }
        .selected-count {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #0a66c2;
            color: white;
            padding: 12px 16px;
            border-radius: 20px;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            display: none;
        }
        .selected-count.show {
            display: block;
        }
        .page {
            display: none;
        }
        .page.active {
            display: block;
        }
        .sport-tag {
            display: inline-block;
            background-color: #f0f2f5;
            padding: 6px 10px;
            border-radius: 16px;
            margin: 3px;
            font-size: 12px;
            font-weight: 500;
        }
        .sport-tag .remove-btn {
            margin-left: 6px;
            cursor: pointer;
            color: #65676b;
        }
        .sport-tag .remove-btn:hover {
            color: #000;
        }
        .add-more-btn {
            width: 100%;
            background-color: #f0f2f5;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .add-more-btn:hover {
            background-color: #e4e6eb;
        }
        .save-btn {
            width: 100%;
            background-color: #1878F3;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            position: fixed;
            bottom: 16px;
            left: 16px;
            right: 16px;
            max-width: calc(100% - 32px);
        }
        .save-btn:hover {
            background-color: #0d5ecf;
        }
        .sports-container {
            padding-bottom: 80px;
        }
        .sports-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
    </style>

<body class="max-w-md mx-auto min-h-screen pb-20">
    <!-- Add Sports Page -->
    <div id="add-sports-page" class="page active">
        <!-- Header -->
        <header class="p-4 flex items-center justify-between">
            <div class="flex items-center">
                <button class="text-2xl mr-4">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                <h1 class="text-2xl font-bold">Add sports</h1>
            </div>
            <button id="done-btn" class="text-lg font-bold text-blue-600 hover:text-blue-700">
                Done
            </button>
        </header>

        <!-- Search Bar -->
        <div class="px-4 mb-6">
            <div class="search-container flex items-center px-4 py-2">
                <i class="fa-solid fa-magnifying-glass text-gray-500 mr-3"></i>
                <input 
                    type="text" 
                    id="search-input"
                    placeholder="Search sports" 
                    class="bg-transparent border-none outline-none w-full text-lg placeholder-gray-500"
                >
            </div>
        </div>

        <!-- Content -->
        <div class="px-4">
            <div id="sports-list" class="sports-list"></div>
        </div>

        <!-- Selected Count Badge -->
        <div id="selected-count" class="selected-count">
            <span id="count-text">0 selected</span>
        </div>
    </div>

    <!-- Sports Confirmation Page -->
    <div id="sports-page" class="page">

            <button id="add-more-btn" class="add-more-btn">

            <!-- Selected sports will be displayed here -->
        </div>

        <!-- Save Button -->
        <button id="save-btn" class="save-btn">Save</button>
    </div>

        // Initialize sports
        allSports = sportsData;
        trendingSports = sportsData.slice(0, 11);
        renderSports(trendingSports);

        function updateSelectedCount() {
            if (selectedSports.size > 0) {
                countText.textContent = `${selectedSports.size} selected`;
                selectedCountBadge.classList.add('show');
            } else {
                selectedCountBadge.classList.remove('show');
            }
        }

        function toggleSport(sportName, button) {
            if (selectedSports.has(sportName)) {
                selectedSports.delete(sportName);
                button.classList.remove('active');
                button.innerHTML = '<i class="fa-solid fa-circle-plus"></i>';
            } else {
                selectedSports.add(sportName);
                button.classList.add('active');
                button.innerHTML = '<i class="fa-solid fa-circle-check"></i>';
            }
            updateSelectedCount();
        }

        const sportImageFallback =
            "https://placehold.co/300x300/e4e6eb/65676b?text=Sport";

        function getSportImageUrl(sport) {
            const query = `${sport.name} sport action`;
            return (
                "https://tse1.mm.bing.net/th" +
                "?q=" + encodeURIComponent(query) +
                "&w=300&h=300&c=7&rs=1&p=0&dpr=2" +
                "&pid=1.7&mkt=en-US&adlt=moderate"
            );
        }

        function renderSports(sports) {
            sportsList.innerHTML = '';
            sports.forEach((sport, index) => {
                const item = document.createElement('div');
                item.className = 'sport-item';
                const isSelected = selectedSports.has(sport.name);
                const buttonClass = isSelected ? 'add-btn active' : 'add-btn';
                const iconClass = isSelected ? 'fa-solid fa-circle-check' : 'fa-solid fa-circle-plus';
                
                item.innerHTML = `
                    <img
                        src="${getSportImageUrl(sport)}"
                        alt="${sport.name}"
                        class="sport-image"
                        loading="lazy"
                        referrerpolicy="no-referrer"
                        onerror="this.onerror=null;this.src=sportImageFallback"
                    >
                    <div class="sport-info">
                        <p class="sport-title">${sport.name}</p>
                        <p class="sport-meta">${sport.category} · ${sport.popularity}</p>
                    </div>
                    <button class="${buttonClass}">
                        <i class="${iconClass}"></i>
                    </button>
                `;
                
                const button = item.querySelector('button');
                button.addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleSport(sport.name, button);
                });
                
                sportsList.appendChild(item);
            });
        }

        function displaySelectedSports() {
            sportsDisplay.innerHTML = '';
            selectedSports.forEach(sport => {
                const tag = document.createElement('div');
                tag.className = 'sport-tag';
                tag.innerHTML = `
                    ${sport}
                    <span class="remove-btn">×</span>
                `;
                tag.querySelector('.remove-btn').addEventListener('click', () => {
                    selectedSports.delete(sport);
                    displaySelectedSports();
                });
                sportsDisplay.appendChild(tag);
            });
        }

        function showPage(page) {
            addSportsPage.classList.remove('active');
            sportsPage.classList.remove('active');
            page.classList.add('active');
        }

        // Done button handler
        document.getElementById('done-btn').addEventListener('click', () => {
            if (selectedSports.size > 0) {
                displaySelectedSports();
                showPage(sportsPage);
            } else {
                alert('Please select at least one sport');
            }
        });

        // Close button handler
        document.getElementById('close-btn').addEventListener('click', () => {
            showPage(addSportsPage);
        });

        // Add more button handler
        document.getElementById('add-more-btn').addEventListener('click', () => {
            showPage(addSportsPage);
        });

        // Save button handler
        document.getElementById('save-btn').addEventListener('click', () => {
            const sportsList = Array.from(selectedSports).join(', ');
            alert(`Sports saved: ${sportsList}`);
        });

        // Search functionality
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            if (query === '') {
                renderSports(trendingSports);
            } else {
                const filtered = allSports.filter(sport => 
                    sport.name.toLowerCase().includes(query)
                );
                renderSports(filtered);
            }
        });
