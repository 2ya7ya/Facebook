function getFrameScrollY(){
  try{
    const w=frame.contentWindow;
    const d=frame.contentDocument;
    if(!w || !d) return 0;
    return Math.max(0,
      w.pageYOffset||0,
      (d.documentElement&&d.documentElement.scrollTop)||0,
      (d.body&&d.body.scrollTop)||0
    );
  }catch(e){return 0;}
}
function setFrameScrollY(y){
  try{
    y=Math.max(0,parseInt(y||0,10)||0);
    const w=frame.contentWindow;
    const d=frame.contentDocument;
    if(w && typeof w.scrollTo==='function') w.scrollTo(0,y);
    if(d && d.documentElement) d.documentElement.scrollTop=y;
    if(d && d.body) d.body.scrollTop=y;
  }catch(e){}
}
function saveEditProfileScrollPosition(){
  if(current!=='edit_profile.html') return;
  editProfileScrollY=getFrameScrollY();
  try{ sessionStorage.setItem('mergedEditProfileScrollY',String(editProfileScrollY)); }catch(e){}
}
function restoreEditProfileScrollPosition(){
  if(current!=='edit_profile.html') return;
  let y=editProfileScrollY;
  try{ y=parseInt(sessionStorage.getItem('mergedEditProfileScrollY')||String(y||0),10)||0; }catch(e){}

  // first manual scroll and make the page feel like it is pushing up/down.
  if(y){ setFrameScrollY(y); }
  showFrameAfterEditProfileRestore();
}

    return vals.map(v=>normalize(v)).filter(Boolean);
  }catch(e){return [];}
}

    const feature=data && data.features && data.features[0];
    const center=feature && feature.center;
    if(input && center && center.length>=2){
      input.dataset.mapboxLng=center[0];
      input.dataset.mapboxLat=center[1];
    }
    const waitForMapbox=()=>new Promise((resolve,reject)=>{
      let tries=0;
      (function check(){
        if(win && win.mapboxgl) return resolve(win.mapboxgl);
        if(++tries>30) return reject(new Error('mapboxgl unavailable'));
        setTimeout(check,100);
      })();
    });
    const mapboxgl=await waitForMapbox();
    if(!mapEl || !center || center.length<2) return;
    mapboxgl.accessToken=token;
    if(win.__mergedSavedLocationMap){ try{win.__mergedSavedLocationMap.remove();}catch(e){} }
    const lng=Number(center[0]), lat=Number(center[1]);
    if(!Number.isFinite(lng)||!Number.isFinite(lat)) return;
    const map=new mapboxgl.Map({container:mapEl,style:'mapbox://styles/mapbox/streets-v12',center:[lng,lat],zoom:12,interactive:true});
    win.__mergedSavedLocationMap=map;
    map.on('load',()=>{
      const markerEl=doc.createElement('div');
      markerEl.className='custom-marker';
      markerEl.textContent='⌖';
      const title=(feature.text||savedValue.split(',')[0]||'Location');
      const region=(feature.place_name||savedValue);
      const popup=new mapboxgl.Popup({offset:25,closeButton:true}).setHTML('<div class="popup-title">'+title+'</div><div class="popup-region">'+region+'</div>');
      new mapboxgl.Marker(markerEl).setLngLat([lng,lat]).setPopup(popup).addTo(map);
    });
  }catch(e){
    if(mapEl && !mapEl.children.length){
      mapEl.innerHTML='<div style="height:100%;display:flex;align-items:center;justify-content:center;color:#65676b;font-size:14px;text-align:center;padding:12px;box-sizing:border-box;">'+savedValue+'</div>';
    }
  }
}

// Render saved/selected confirmation items as list rows with thumbnails instead of plain tags.
const MERGED_POSTER_LIST_CONFIG = {
  'add_hobbies.html': {display:'hobbies-display', tag:'hobby-tag', query:'hobby activity', shape:'square', item:'hobby'},
  'add_songs.html': {display:'songs-display', tag:'song-tag', query:'song album cover', shape:'square', item:'song'},
  'add_tv_shows.html': {display:'shows-display', tag:'show-tag', query:'official TV show poster', shape:'poster', item:'show'},
  'add_movies.html': {display:'movies-display', tag:'movie-tag', query:'official movie poster', shape:'poster', item:'movie'},
  'add_games.html': {display:'games-display', tag:'game-tag', query:'video game cover', shape:'poster', item:'game'},
  'add_sports.html': {display:'sports-display', tag:'sport-tag', query:'sport action', shape:'square', item:'sport'},
  'add_places.html': {display:'places-display', tag:'place-tag', query:'landmark travel', shape:'square', item:'place'}
};
function mergedPosterEsc(value){
  return String(value==null?'':value).replace(/[&<>"']/g,function(ch){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];
  });
}
function mergedPosterCleanName(value){
  return normalize(String(value==null?'':value).replace(/×/g,' ')).replace(/\s+/g,' ').trim();
}
function mergedPosterImageUrl(file,name){
  const cfg=MERGED_POSTER_LIST_CONFIG[file]||{};
  const q=(String(name||'')+' '+(cfg.query||'poster')).trim();
  const size=(cfg.shape==='poster') ? '&w=300&h=450' : '&w=300&h=300';
  return 'https://tse1.mm.bing.net/th?q='+encodeURIComponent(q)+size+'&c=7&rs=1&p=0&dpr=2&pid=1.7&mkt=en-US&adlt=moderate';
}
function mergedPosterFallbackDataUri(shape){
  const svg = shape==='poster'
    ? '<svg xmlns="http://www.w3.org/2000/svg" width="90" height="126" viewBox="0 0 90 126"><rect width="90" height="126" rx="10" fill="#eef0f4"/><circle cx="45" cy="52" r="18" fill="#d5d9e2"/><rect x="18" y="86" width="54" height="8" rx="4" fill="#d5d9e2"/><rect x="26" y="100" width="38" height="6" rx="3" fill="#d5d9e2"/></svg>'
    : '<svg xmlns="http://www.w3.org/2000/svg" width="90" height="90" viewBox="0 0 90 90"><rect width="90" height="90" rx="12" fill="#eef0f4"/><circle cx="45" cy="36" r="16" fill="#d5d9e2"/><rect x="19" y="62" width="52" height="7" rx="3.5" fill="#d5d9e2"/></svg>';
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}
function mergedPosterCollectNames(doc,file,display){
  const cfg=MERGED_POSTER_LIST_CONFIG[file];
  const out=[];
  const add=function(v){
    v=mergedPosterCleanName(v);
    if(v && !out.includes(v)) out.push(v);
  };
  if(display){
    display.querySelectorAll('.merged-confirm-list-row').forEach(row=>add(row.getAttribute('data-name')||row.querySelector('.merged-confirm-title')?.textContent||''));
    display.querySelectorAll('.'+cfg.tag+', .tag, [data-name]').forEach(el=>{
      if(el.classList.contains('merged-confirm-list-row')) return;
      add(el.getAttribute('data-name')||el.innerText||el.textContent);
    });
    if(!out.length){
      Array.from(display.children||[]).forEach(el=>add(el.getAttribute('data-name')||el.innerText||el.textContent));
    }
  }
  if(!out.length) getMergedSavedValues(file).forEach(add);
  return out;
}
function mergedPosterSaveValues(file,values){
  try{
    const all=JSON.parse(localStorage.getItem('mergedProfileData')||'{}');
    all[file]={values:Array.from(new Set((values||[]).map(mergedPosterCleanName).filter(Boolean))),updatedAt:Date.now()};
    localStorage.setItem('mergedProfileData',JSON.stringify(all));
  }catch(e){}
}
function renderMergedPosterList(doc,file,force){
  const cfg=MERGED_POSTER_LIST_CONFIG[file];
  if(!doc || !cfg) return false;
  const display=doc.getElementById(cfg.display);
  if(!display) return false;
  const names=mergedPosterCollectNames(doc,file,display);
  if(!names.length) return false;
  const key=names.join('||');
  if(!force && display.getAttribute('data-merged-poster-key')===key && display.querySelector('.merged-confirm-list-row')) return true;
  const styleId='merged-confirm-list-style';
  if(!doc.getElementById(styleId)){
    const st=doc.createElement('style');
    st.id=styleId;
    st.textContent=`
      #${cfg.display}{display:flex!important;flex-direction:column!important;gap:0!important;padding-bottom:88px!important;}
      .merged-confirm-list-row{display:flex!important;align-items:center!important;gap:12px!important;width:100%!important;padding:9px 0!important;border-bottom:1px solid #f0f2f5!important;background:#fff!important;box-sizing:border-box!important;}
      .merged-confirm-list-row:last-child{border-bottom:none!important;}
      .merged-confirm-thumb{width:54px!important;height:54px!important;border-radius:10px!important;object-fit:cover!important;background:#eef0f4!important;flex:0 0 54px!important;display:block!important;}
      .merged-confirm-thumb.poster{width:48px!important;height:68px!important;border-radius:6px!important;flex-basis:48px!important;}
      .merged-confirm-info{flex:1 1 auto!important;min-width:0!important;display:block!important;}
      .merged-confirm-title{font-size:15px!important;font-weight:600!important;color:#111827!important;line-height:1.25!important;white-space:normal!important;overflow:hidden!important;text-overflow:ellipsis!important;display:-webkit-box!important;-webkit-line-clamp:2!important;-webkit-box-orient:vertical!important;}
      .merged-confirm-meta{font-size:12px!important;color:#65676b!important;margin-top:3px!important;line-height:1.2!important;}
      .merged-confirm-remove{width:30px!important;height:30px!important;border:none!important;background:transparent!important;color:#65676b!important;font-size:22px!important;font-weight:300!important;line-height:30px!important;display:flex!important;align-items:center!important;justify-content:center!important;flex:0 0 30px!important;padding:0!important;margin:0!important;}
      .${cfg.tag}{display:none!important;}
    `;
    (doc.head||doc.documentElement).appendChild(st);
  }
  display.setAttribute('data-merged-poster-key',key);
  display.innerHTML=names.map(name=>{
    const esc=mergedPosterEsc(name);
    const img=mergedPosterImageUrl(file,name);
    const fallback=mergedPosterFallbackDataUri(cfg.shape);
    const posterClass=cfg.shape==='poster'?' poster':'';
    const meta=cfg.item ? (cfg.item.charAt(0).toUpperCase()+cfg.item.slice(1)) : 'Selected';
    return `<div class="merged-confirm-list-row" data-name="${esc}">
      <img class="merged-confirm-thumb${posterClass}" src="${img}" alt="${esc}" loading="lazy" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src='${fallback}'">
      <div class="merged-confirm-info"><div class="merged-confirm-title">${esc}</div><div class="merged-confirm-meta">${meta}</div></div>
      <button class="merged-confirm-remove" type="button" aria-label="Remove" data-remove="${esc}">×</button>
    </div>`;
  }).join('');
  display.querySelectorAll('.merged-confirm-remove').forEach(btn=>{
    btn.addEventListener('click',function(e){
      e.preventDefault(); e.stopPropagation();
      const row=btn.closest('.merged-confirm-list-row');
      const name=row ? row.getAttribute('data-name') : '';
      if(row) row.remove();
      const remaining=Array.from(display.querySelectorAll('.merged-confirm-list-row')).map(r=>r.getAttribute('data-name')||'').filter(Boolean);
      display.setAttribute('data-merged-poster-key',remaining.join('||'));
      mergedPosterSaveValues(file,remaining);
      try{
        const win=doc.defaultView;
        const setName={
          'add_hobbies.html':'selectedHobbies','add_songs.html':'selectedSongs','add_tv_shows.html':'selectedShows','add_movies.html':'selectedMovies','add_games.html':'selectedGames','add_sports.html':'selectedSports','add_places.html':'selectedPlaces'
        }[file];
        if(win && setName && win[setName] && typeof win[setName].delete==='function') win[setName].delete(name);
      }catch(err){}
    },true);
  });
  return true;
}
function setupMergedPosterConfirmationList(doc,file){
  const cfg=MERGED_POSTER_LIST_CONFIG[file];
  if(!doc || !cfg) return;
  const display=doc.getElementById(cfg.display);
  if(!display) return;
  const rerender=()=>{ try{ renderMergedPosterList(doc,file,false); }catch(e){} };
  setTimeout(rerender,0);

  try{
    const obs=new doc.defaultView.MutationObserver(function(){ setTimeout(rerender,0); });
    obs.observe(display,{childList:true,subtree:true});

function wirePage(){
  const doc=frame.contentDocument; if(!doc)return;
  if(current==='add_status.html'){
    doc.querySelectorAll('.android-nav,.nav-item,.nav-bars,.nav-bar-line,.nav-circle,.nav-back').forEach(el=>el.remove());
    const st=doc.createElement('style');
    st.textContent='.android-nav,.nav-item,.nav-bars,.nav-bar-line,.nav-circle,.nav-back{display:none!important;}';
    doc.head.appendChild(st);
  }
  unifyAllCloseButtons(doc);
  setupMergedPosterConfirmationList(doc,current);

  // Unified X buttons: every X closes back to Edit profile like About you.
  doc.addEventListener('click',function(e){
    const el=e.target.closest&&e.target.closest('.merged-unified-x,.close-icon,.close-btn,[aria-label="Close"]');
    if(!el)return;
    const text=(el.innerText||el.textContent||'').trim().toLowerCase();
    const isX=text==='×' || text==='✕' || text==='x' || el.classList.contains('merged-unified-x') || el.getAttribute('aria-label')==='Close';
    if(!isX)return;
    e.preventDefault();
    e.stopPropagation();
    e.stopImmediatePropagation();
    stack=[];
    openPage('edit_profile.html',false);
  },true);
  if(current==='pinned_details.html'){
    populatePinned(doc);
    doc.addEventListener('click',function(e){
      const save=e.target.closest&&e.target.closest('.save-button');
      if(!save)return;
      e.preventDefault();
      e.stopPropagation();
      e.stopImmediatePropagation();
      const selected=Array.from(doc.querySelectorAll('.checkbox.checked')).map(item=>item.dataset.id).filter(Boolean).slice(0,5);
      try{ localStorage.setItem('pinnedDetailsSelection',JSON.stringify(selected)); }catch(err){}
      try{ persistEditorSnapshot(JSON.parse(localStorage.getItem('mergedProfileData')||'{}')); }catch(err){}
      try{ if(window.parent&&window.parent!==window.parent.parent) window.parent.parent.postMessage({type:'editProfileDataSaved'},'*'); }catch(err){}
      stack=[];
      openPage('edit_profile.html',false);
    },true);
  }
  if(current==='edit_profile.html'){
    fixEditProfileSectionOverlap(doc);
    try{
      const win=doc.defaultView;
      if(win && !win.__mergedEditScrollMemory){
        win.__mergedEditScrollMemory=true;
        win.addEventListener('scroll',function(){
          editProfileScrollY=getFrameScrollY();
          try{ sessionStorage.setItem('mergedEditProfileScrollY',String(editProfileScrollY)); }catch(e){}
        },{passive:true});
      }
    }catch(e){}
    restoreEditProfileScrollPosition();
  }

  // Add Location and Add Hometown: keep the add/confirmation flow stable.
  if(current==='add_location.html' || current==='add_hometown.html'){
    function forceLocationConfirm(){
      const prepaint=doc.getElementById('merged-prepaint-confirm');
      if(prepaint) prepaint.remove();
      const searchScreen=doc.getElementById('search-screen');
      const confirmScreen=doc.getElementById('confirm-screen');
      if(searchScreen){
        searchScreen.classList.remove('active');
        searchScreen.style.display='none';
        searchScreen.style.visibility='hidden';
      }
      if(confirmScreen){
        confirmScreen.classList.add('active');
        confirmScreen.style.display='flex';
        confirmScreen.style.visibility='visible';
        confirmScreen.style.opacity='1';
      }
    }
    doc.defaultView.__mergedLocationBackToConfirm=function(){
      const input=doc.getElementById('location-input');
      const hasCurrent=!!(input && normalize(input.value));
      if(hasCurrent || hasMergedSavedValue(current)){
        forceLocationConfirm();
        if(!hasCurrent) showSavedLocationConfirmation(doc,current);
      }else{
        stack=[];
        openPage('edit_profile.html',false);
      }
    };
    doc.addEventListener('click',function(e){
      const backArrow=e.target.closest&&e.target.closest('#search-screen .header .icon-btn');
      if(!backArrow)return;
      e.preventDefault();
      e.stopPropagation();
      e.stopImmediatePropagation();
      doc.defaultView.__mergedLocationBackToConfirm();
    },true);
    doc.addEventListener('click',function(e){
      const result=e.target.closest&&e.target.closest('#search-screen .result-item');
      if(!result)return;
      setTimeout(function(){
        const input=doc.getElementById('location-input');
        if(input && normalize(input.value)) forceLocationConfirm();
      },80);
    },true);
    if(pendingSavedLocationConfirmPage===current){
      pendingSavedLocationConfirmPage=null;
      setTimeout(()=>showSavedLocationConfirmation(doc,current),0);
    }
  }

  // Location and Hometown confirmation pages: X and Save return to Edit Profile; tapping the selected box opens the add/search page.
  if(current==='add_location.html' || current==='add_hometown.html'){
    const locationSearchScreen = doc.getElementById('search-screen');
    const locationConfirmScreen = doc.getElementById('confirm-screen');
    const locationSearchInput = doc.getElementById('location-search');
    function openLocationAddScreen(){
      const prepaint = doc.getElementById('merged-prepaint-confirm');
      if(prepaint) prepaint.remove();
      if(locationConfirmScreen){
        locationConfirmScreen.classList.remove('active');
        locationConfirmScreen.style.display='none';
        locationConfirmScreen.style.visibility='hidden';
        locationConfirmScreen.style.opacity='';
      }
      if(locationSearchScreen){
        locationSearchScreen.classList.add('active');
        locationSearchScreen.style.display='';
        locationSearchScreen.style.visibility='';
        locationSearchScreen.style.opacity='';
      }
      try{ if(locationSearchInput) locationSearchInput.focus(); }catch(err){}
    }
    doc.addEventListener('click',function(e){
      const closeBtn = e.target.closest && e.target.closest('#confirm-screen #back-to-search, #confirm-screen .close-icon, #confirm-screen .close-btn, #confirm-screen [aria-label="Close"]');
      const saveBtn = e.target.closest && e.target.closest('#confirm-screen .save-button, #confirm-screen #save-btn, #confirm-screen button');
      const selectedBox = e.target.closest && e.target.closest('#confirm-screen .input-container, #confirm-screen .location-box, #confirm-screen .selected-location, #confirm-screen .confirm-card');
      const saveText = normalize(saveBtn && (saveBtn.innerText || saveBtn.textContent));
      if(closeBtn){
        e.preventDefault();
        e.stopPropagation();
        e.stopImmediatePropagation();
        stack=[];
        openPage('edit_profile.html',false);
        return;
      }
      if(saveBtn && /^save$/i.test(saveText)){
        e.preventDefault();
        e.stopPropagation();
        e.stopImmediatePropagation();
        savePageData(current,doc);
        stack=[];
        openPage('edit_profile.html',false);
        return;
      }
      if(selectedBox){
        e.preventDefault();
        e.stopPropagation();
        e.stopImmediatePropagation();
        openLocationAddScreen();
        return;
      }
    },true);
  }


  // Add Links: keep the add/confirmation flow stable.
  // Done opens the links confirmation page and must not be overridden by the global Done/Save handler.
  // From the Add Links screen, arrow/Android back return to the confirmation page when links exist.
  // From the links confirmation page, Android back/X/Save return to Edit Profile.
  if(current==='add_links.html'){
    const addLinksPage=doc.getElementById('add-links-page');
    const linksPage=doc.getElementById('links-page');
    const linksDisplay=doc.getElementById('links-display');
    const linksDoneBtn=doc.querySelector('#add-links-page #done-btn');
    function updateLinksDoneDisabled(){
      if(!linksDoneBtn) return;
      const hasSelected=!!doc.querySelector('#add-links-page .add-btn.active');
      linksDoneBtn.disabled=!hasSelected;
      linksDoneBtn.setAttribute('aria-disabled', hasSelected?'false':'true');
      linksDoneBtn.style.color=hasSelected?'':'#bcc0c4';
      linksDoneBtn.style.pointerEvents=hasSelected?'':'none';
    }
    updateLinksDoneDisabled();
    try{
      const linksObs=new MutationObserver(updateLinksDoneDisabled);
      if(addLinksPage) linksObs.observe(addLinksPage,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});
      ['input','click','keyup','change'].forEach(ev=>doc.addEventListener(ev,function(){setTimeout(updateLinksDoneDisabled,0);},true));
    }catch(e){}
    function linksHasItems(){
      try{
        const w=doc.defaultView;
        if(w && w.selectedLinks && typeof w.selectedLinks.size==='number' && w.selectedLinks.size>0) return true;
      }catch(e){}
      if(linksDisplay && normalize(linksDisplay.textContent)) return true;
      if(doc.querySelector('#links-display .link-tag')) return true;
      try{return hasMergedSavedValue('add_links.html');}catch(e){return false;}
    }
    function showLinksConfirm(){
      const prepaint=doc.getElementById('merged-prepaint-confirm');
      if(prepaint) prepaint.remove();
      try{
        const w=doc.defaultView;
        if(w && typeof w.displaySelectedLinks==='function') w.displaySelectedLinks();
      }catch(e){}
      if(addLinksPage){
        addLinksPage.classList.remove('active');
        addLinksPage.style.display='none';
        addLinksPage.style.visibility='hidden';
        addLinksPage.style.opacity='';
      }
      if(linksPage){
        linksPage.classList.add('active');
        linksPage.style.display='block';
        linksPage.style.visibility='visible';
        linksPage.style.opacity='1';
      }
      return true;
    }
    function showLinksAdd(){
      const prepaint=doc.getElementById('merged-prepaint-confirm');
      if(prepaint) prepaint.remove();
      if(linksPage){
        linksPage.classList.remove('active');
        linksPage.style.display='';
        linksPage.style.visibility='';
        linksPage.style.opacity='';
      }
      if(addLinksPage){
        addLinksPage.classList.add('active');
        addLinksPage.style.display='block';
        addLinksPage.style.visibility='visible';
        addLinksPage.style.opacity='1';
      }
      return true;
    }
    try{
      doc.defaultView.__mergedLinksBack=function(){
        // Android/browser back from Add Links should always return to Edit Profile.
        // Do not reopen the links confirmation page from the Add Links screen.
        stack=[]; openPage('edit_profile.html',false); return true;
      };
    }catch(e){}
    doc.addEventListener('click',function(e){
      const done=e.target.closest&&e.target.closest('#add-links-page #done-btn');
      const back=e.target.closest&&e.target.closest('#add-links-page header button:first-of-type, #add-links-page .back-btn, #add-links-page [aria-label="Back"]');
      const addMore=e.target.closest&&e.target.closest('#links-page #add-more-btn, #links-page .add-more-btn');
      const save=e.target.closest&&e.target.closest('#links-page #save-btn, #links-page .save-btn');
      const close=e.target.closest&&e.target.closest('#links-page #close-btn, #links-page .close-icon, #links-page .close-btn, #links-page [aria-label="Close"]');
      if(done){
        if(done.disabled || done.getAttribute('aria-disabled')==='true'){
          e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
          return;
        }
        if(linksHasItems()){
          e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
          savePageData('add_links.html',doc);
          showLinksConfirm();
        }
        return;
      }
      if(back){

      const empty=doc.getElementById('empty-state');
      if(!input || input.__mergedPlacesSearchInstalled) return;

      const token='MAPBOX_TOKEN_REMOVED';
      let timer=null;
      function setLoading(show){ if(indicator) indicator.style.display=show?'block':'none'; }
      function showMessage(msg){
        if(list) list.innerHTML='<div class="empty-state"><p>'+msg+'</p></div>';
        if(empty) empty.style.display='none';
      }
      function render(places){
        if(win && typeof win.renderPlaces==='function'){
          win.renderPlaces(places);
        }else if(list){
          list.innerHTML=places.map(place=>{
            const name=String(place.name||'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
            const region=String(place.region||'Location').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
            return '<div class="place-item"><div class="place-info"><p class="place-title">'+name+'</p><p class="place-meta">'+region+'</p></div><button class="add-btn"><i class="fa-solid fa-circle-plus"></i></button></div>';
          }).join('');

      if(doc && doc.body) doc.body.dataset.openedFrom = openedLanguagesFromGender ? 'gender' : '';
    }catch(err){}
    if(mainBtn && !mainBtn.querySelector('.merged-language-back-icon')){
      mainBtn.innerHTML='<img class="merged-language-back-icon" src="/edit_profile_assets/9558706dd5aa50a503d5.png" alt="" aria-hidden="true">';
      mainBtn.setAttribute('aria-label','Back');
      mainBtn.style.background='none';
      mainBtn.style.border='none';
      mainBtn.style.padding='0';
      mainBtn.style.display='flex';
      mainBtn.style.alignItems='center';
      mainBtn.style.justifyContent='center';
    }
    const win=doc.defaultView;
    const search=doc.getElementById('lang-search') || doc.querySelector('.add-search-input');
    const mainInput=doc.getElementById('main-display-input');
    const mainSave=doc.querySelector('#screen-main .save-button');
    function syncLanguageSaveButton(){
      if(!mainSave)return;
      const hasValue=!!(mainInput && normalize(mainInput.value));
      mainSave.disabled=!hasValue;
      mainSave.classList.toggle('merged-disabled',!hasValue);
      mainSave.setAttribute('aria-disabled', hasValue ? 'false' : 'true');
    }
    if(search){
      search.removeAttribute('autofocus');
      search.blur();
    }
    if(win && typeof win.showAddScreen==='function'){
      const originalShowAddScreen=win.showAddScreen;
      win.showAddScreen=function(){
        originalShowAddScreen.apply(win,arguments);
        setTimeout(()=>{ try{ search && search.blur(); doc.activeElement && doc.activeElement.blur && doc.activeElement.blur(); syncLanguageSaveButton(); }catch(err){} },0);
        setTimeout(()=>{ try{ search && search.blur(); doc.activeElement && doc.activeElement.blur && doc.activeElement.blur(); syncLanguageSaveButton(); }catch(err){} },120);
      };
    }
    if(win && typeof win.showMainScreen==='function'){
      const originalShowMainScreen=win.showMainScreen;
      win.showMainScreen=function(){
        originalShowMainScreen.apply(win,arguments);
        setTimeout(syncLanguageSaveButton,0);
      };
    }
    syncLanguageSaveButton();
    doc.addEventListener('input',()=>setTimeout(syncLanguageSaveButton,0),true);
    doc.addEventListener('change',()=>setTimeout(syncLanguageSaveButton,0),true);
    doc.addEventListener('click',()=>setTimeout(syncLanguageSaveButton,0),true);
    setTimeout(()=>{ try{ search && search.blur(); doc.activeElement && doc.activeElement.blur && doc.activeElement.blur(); }catch(err){} },0);
    setTimeout(()=>{ try{ search && search.blur(); doc.activeElement && doc.activeElement.blur && doc.activeElement.blur(); }catch(err){} },150);
    doc.addEventListener('click',function(e){
      const mainBack=e.target.closest&&e.target.closest('#screen-main header button');
      const addBack=e.target.closest&&e.target.closest('#screen-add .back-icon');
      const save=e.target.closest&&e.target.closest('#screen-main .save-button');
      if(!mainBack && !addBack && !save)return;
      e.preventDefault();
      e.stopPropagation();
      e.stopImmediatePropagation();
      if(mainBack){
        if(openedLanguagesFromGender){
          if(stack[stack.length-1]==='add_gender.html') stack.pop();
          openPage('add_gender.html',false);
        }else{
          stack=[];
          openPage('edit_profile.html',false);
        }
      } else if(addBack){
        if(typeof win.showMainScreen==='function') win.showMainScreen();
        else {
          doc.getElementById('screen-add')?.classList.remove('active');
          doc.getElementById('screen-main')?.classList.add('active');
        }
      } else if(save){
        syncLanguageSaveButton();
        if(save.disabled || save.classList.contains('merged-disabled')) return;
        savePageData('add_languages.html',doc);
        stack=[];
        openPage('edit_profile.html',false);
      }
    },true);
  }

  // Birthday: the top arrow returns directly to Edit profile.
  if(current==='add_birthday.html'){
    doc.addEventListener('click',function(e){
      const el=e.target.closest&&e.target.closest('button,[aria-label="Go back"],[aria-label="Back"]');
      const label=(el && el.getAttribute && (el.getAttribute('aria-label')||'')).toLowerCase();
      const text=normalize(el && (el.innerText||el.textContent));
      const isBirthdayBack=el && (label==='go back' || label==='back' || text==='‹' || text==='←');
      if(!isBirthdayBack)return;
      e.preventDefault();
      e.stopPropagation();
      e.stopImmediatePropagation();
      stack=[];
      openPage('edit_profile.html',false);
    },true);
  }


  // Status: the X button returns directly to Edit profile.
  if(current==='add_status.html'){
    doc.addEventListener('click',function(e){
      const el=e.target.closest&&e.target.closest('.close-icon,[aria-label="Close"],[aria-label="Back"],button');
      const text=normalize(el && (el.innerText||el.textContent));
      const close=el && (el.matches('.close-icon,[aria-label="Close"],[aria-label="Back"]') || text==='×' || text==='✕' || text==='x');
      if(!close)return;
      e.preventDefault();
      e.stopPropagation();
      e.stopImmediatePropagation();
      stack=[];
      openPage('edit_profile.html',false);
    },true);
  }


  // About you: the X button must always return directly to Edit profile.
  if(current==='add_bio.html'){
    doc.addEventListener('click',function(e){
      const el=e.target.closest&&e.target.closest('.close-icon,.close-btn,[aria-label="Close"],[aria-label="Back"],button');
      const text=normalize(el && (el.innerText||el.textContent));
      const close=el && (el.matches('.close-icon,.close-btn,[aria-label="Close"],[aria-label="Back"]') || text==='×' || text==='✕' || text==='x');
      if(!close)return;
      e.preventDefault();
      e.stopPropagation();
      e.stopImmediatePropagation();
      stack=[];
      openPage('edit_profile.html',false);
    },true);
  }

  doc.addEventListener('click',function(e){
    const target=e.target.closest('a,button,.item-row,[onclick]'); if(!target)return;
    const href=target.getAttribute&&target.getAttribute('href');
    if(href){ const leaf=href.split('/').pop().split('?')[0]; if(PAGES[leaf]){e.preventDefault();openPage(leaf);return;} }
    const text=normalize((target.querySelector&&target.querySelector('.label')?.textContent)||target.textContent);
    if(current==='edit_profile.html'){
      const route=routeForLabel(text);
      if(route){
        e.preventDefault();
        e.stopPropagation();
        pendingSavedLocationConfirmPage=null;
        pendingSavedConfirmPage=null;
        if((route==='add_location.html' || route==='add_hometown.html') && hasMergedSavedValue(route)){
          pendingSavedLocationConfirmPage=route;
        } else if(SAVED_CONFIRM_CONFIG[route] && hasMergedSavedValue(route)){
          pendingSavedConfirmPage=route;
        }
        openPage(route);
        return;
      }
    }
    const cls=String(target.className||'').toLowerCase();
    const isBack=/(^|\s)(back|close)(-|_|\s|$)/.test(cls)||['Back','Go back','Close'].includes(target.getAttribute('aria-label'))||text==='‹'||text==='←'||text==='✕';
    if(isBack){e.preventDefault();e.stopPropagation();goBack();return;}
    if(current==='add_hobbies.html' && /^done$/i.test(text)){
      const doneBtn=target.closest && target.closest('#add-hobbies-page #done-btn');
      if(doneBtn){
        e.preventDefault();
        e.stopPropagation();
        e.stopImmediatePropagation();
        if(doneBtn.disabled || doneBtn.classList.contains('merged-disabled') || doneBtn.getAttribute('aria-disabled')==='true') return;
        try{
          const w=doc.defaultView;
          if(w && typeof w.__mergedForceHobbiesConfirm==='function') w.__mergedForceHobbiesConfirm();
        }catch(err){}
        return;
      }
    }
    if(/^(done|save)$/i.test(text)){
      const pageAtClick=current;
      const isLocationConfirmSave = (pageAtClick==='add_location.html' || pageAtClick==='add_hometown.html') &&
        /^save$/i.test(text) &&
        !!doc.querySelector('#confirm-screen.active');
      if(isLocationConfirmSave){
        e.preventDefault();
        e.stopPropagation();
      }
      setTimeout(()=>{
        savePageData(pageAtClick,doc);
        if(isLocationConfirmSave){
          stack=[];
          openPage('edit_profile.html',false);
        } else if(!KEEP_CONFIRMATION_OPEN.has(pageAtClick)) {
          goBack();
        }
      },80);
    }
  },false);
}
frame.addEventListener('load',wirePage);

// Direct editor pages live above the already-open Edit Profile page.
// Give Android/system Back one local history entry so Back closes only this editor.
const directEditProfileChildMode = new URLSearchParams(location.search).get('direct') === '1';
if(directEditProfileChildMode){
  window.addEventListener('popstate',function(e){
    if(e && e.stopImmediatePropagation) e.stopImmediatePropagation();
    if(window.parent && window.parent!==window){
      window.parent.postMessage({type:'closeDirectEditProfileChild'},'*');
    }
  },true);
}


// Highest-priority Android/browser back for Add Links flow.
window.addEventListener('popstate',function(e){
  if(current==='add_links.html'){
    if(e && e.stopImmediatePropagation) e.stopImmediatePropagation();
    try{
      const w=frame.contentWindow;
      if(w && typeof w.__mergedLinksBack==='function'){
        w.__mergedLinksBack();
        return;
      }
    }catch(err){}
    stack=[];
    openPage('edit_profile.html',false);
    return;
  }
},true);


// Highest-priority Android/browser back for Work Experience.
window.addEventListener('popstate',function(e){
  if(current==='add_work.html'){
    if(e && e.stopImmediatePropagation) e.stopImmediatePropagation();
    stack=[];
    openPage('edit_profile.html',false);
    return;
  }
},true);

// Highest-priority Android/browser back for Languages opened from Gender Next.
window.addEventListener('popstate',function(e){
  if(current==='add_languages.html'){
    let fromGender=false;
    try{
      const doc=frame.contentDocument;
      fromGender = !!(languagesOpenedFromGender || (frame.contentWindow && frame.contentWindow.__openedFromGender) || (doc && doc.body && doc.body.dataset.openedFrom==='gender') || stack[stack.length-1]==='add_gender.html' || sessionStorage.getItem('mergedLanguagesFromGender')==='1');
    }catch(err){
      try{ fromGender = !!(languagesOpenedFromGender || stack[stack.length-1]==='add_gender.html' || sessionStorage.getItem('mergedLanguagesFromGender')==='1'); }catch(e2){}
    }
    if(fromGender){
      if(e && e.stopImmediatePropagation) e.stopImmediatePropagation();
      stack=[];
      try{ sessionStorage.removeItem('mergedLanguagesFromGender'); }catch(err){}
      languagesOpenedFromGender=false;
      openPage('add_gender.html',false);
      return;
    }
  }
},true);


// Highest-priority Android/browser back for media confirmation pages.
// If the user is on an internal confirmation screen inside these merged pages,
// Android back must return to Edit Profile instead of falling through to the add page or old iframe handlers.
window.addEventListener('popstate',function(e){
  const mediaPages = {
    'add_songs.html': ['#songs-page', '#music-page', '#confirmation-page', '#selected-songs-page'],
    'add_tv_shows.html': ['#shows-page', '#tv-shows-page', '#confirmation-page', '#selected-shows-page'],
    'add_movies.html': ['#movies-page', '#confirmation-page', '#selected-movies-page'],
    'add_games.html': ['#games-page', '#confirmation-page', '#selected-games-page'],
    'add_sports.html': ['#sports-page', '#confirmation-page', '#selected-sports-page']
  };
  if(!mediaPages[current]) return;
  let onConfirm = false;
  try{
    const doc = frame.contentDocument;
    const selectors = mediaPages[current];
    onConfirm = selectors.some(function(sel){
      const el = doc && doc.querySelector(sel);
      return !!(el && (el.classList.contains('active') || getComputedStyle(el).display !== 'none'));
    });
    // Fallback: if the known add page is not active, treat it as confirmation.
    const addSelectors = {
      'add_songs.html': '#add-songs-page',
      'add_tv_shows.html': '#add-shows-page',
      'add_movies.html': '#add-movies-page',
      'add_games.html': '#add-games-page',
      'add_sports.html': '#add-sports-page'
    };
    const addEl = doc && doc.querySelector(addSelectors[current]);
    if(addEl && !addEl.classList.contains('active')) onConfirm = true;
  }catch(err){}
  if(onConfirm){
    if(e && e.stopImmediatePropagation) e.stopImmediatePropagation();
    stack=[];
    openPage('edit_profile.html',false);
  }
},true);

// Android/system back while About you, Add Location, Add Hometown, Birthday, Status, Add Family, Add Gender, or Add School is open returns to Edit profile.
window.addEventListener('popstate',function(){
  if(current==='add_hobbies.html'){
    try{
      const doc=frame.contentDocument;
      const addPage=doc && doc.getElementById('add-hobbies-page');
      if(addPage && addPage.classList.contains('active') && frame.contentWindow && typeof frame.contentWindow.__mergedForceHobbiesConfirm==='function'){
        if(frame.contentWindow.__mergedForceHobbiesConfirm()) return;
      }
    }catch(err){}
    stack=[];
    openPage('edit_profile.html',false);
    return;
  }
  if(current==='add_places.html'){
    try{
      const doc=frame.contentDocument;
      const addPage=doc && doc.getElementById('add-places-page');
      if(addPage && addPage.classList.contains('active') && frame.contentWindow && typeof frame.contentWindow.__mergedPlaceAddBack==='function'){
        frame.contentWindow.__mergedPlaceAddBack();
        return;
      }
    }catch(err){}
    // If we are not on the Add Places screen, we are on the Places confirmation screen.
    // Android/browser back from that confirmation screen must always return to Edit Profile.
    stack=[];
    openPage('edit_profile.html',false);
    return;
  }
  if(current==='add_tv_shows.html'){
    try{
      const doc=frame.contentDocument;
      const addPage=doc && doc.getElementById('add-shows-page');
      if(addPage && addPage.classList.contains('active') && frame.contentWindow && typeof frame.contentWindow.__mergedTvAddBack==='function'){
        frame.contentWindow.__mergedTvAddBack();
        return;
      }
    }catch(err){}
  }
  if(current==='add_movies.html'){
    try{
      const doc=frame.contentDocument;
      const addPage=doc && doc.getElementById('add-movies-page');
      if(addPage && addPage.classList.contains('active') && frame.contentWindow && typeof frame.contentWindow.__mergedMovieAddBack==='function'){
        frame.contentWindow.__mergedMovieAddBack();
        return;
      }
    }catch(err){}
  }
  if(current==='add_games.html'){
    try{
      const doc=frame.contentDocument;
      const addPage=doc && doc.getElementById('add-games-page');
      if(addPage && addPage.classList.contains('active') && frame.contentWindow && typeof frame.contentWindow.__mergedGameAddBack==='function'){
        frame.contentWindow.__mergedGameAddBack();
        return;
      }
    }catch(err){}
  }
  if(current==='add_sports.html'){
    try{
      const doc=frame.contentDocument;
      const addPage=doc && doc.getElementById('add-sports-page');
      if(addPage && addPage.classList.contains('active') && frame.contentWindow && typeof frame.contentWindow.__mergedSportAddBack==='function'){
        frame.contentWindow.__mergedSportAddBack();
        return;
      }
    }catch(err){}
  }
  if(current==='add_location.html' || current==='add_hometown.html'){
    try{
      const doc=frame.contentDocument;
      const searchScreen=doc && doc.getElementById('search-screen');
      if(searchScreen && searchScreen.classList.contains('active') && frame.contentWindow && typeof frame.contentWindow.__mergedLocationBackToConfirm==='function'){
        frame.contentWindow.__mergedLocationBackToConfirm();
        return;
      }
    }catch(err){}
    stack=[];
    openPage('edit_profile.html',false);
    return;
  }
  if(current==='add_languages.html'){
    let backTarget=false;
    try{
      const doc=frame.contentDocument;
      backTarget=!!(languagesOpenedFromGender || (frame.contentWindow && frame.contentWindow.__openedFromGender) || (doc && doc.body && doc.body.dataset.openedFrom==='gender') || stack[stack.length-1]==='add_gender.html' || sessionStorage.getItem('mergedLanguagesFromGender')==='1');
    }catch(err){
      try{ backTarget=!!(languagesOpenedFromGender || stack[stack.length-1]==='add_gender.html' || sessionStorage.getItem('mergedLanguagesFromGender')==='1'); }catch(e2){}
    }
    languagesOpenedFromGender=false;
    stack=[];
    try{ sessionStorage.removeItem('mergedLanguagesFromGender'); }catch(err){}
    openPage(backTarget ? 'add_gender.html' : 'edit_profile.html',false);
    return;
  }
  if(current==='pinned_details.html'){
    stack=[];
    openPage('edit_profile.html',false);
    return;
  }
  if(current==='add_social_media.html' || current==='add_links.html' || current==='contact_information.html'){
    stack=[];
    openPage('edit_profile.html',false);
    return;
  }
  if(current==='add_bio.html' || current==='add_birthday.html' || current==='add_status.html' || current==='add_family.html' || current==='add_gender.html' || current==='add_school.html' || current==='add_work.html'){
    stack=[];
    openPage('edit_profile.html',false);
  }
});

const requestedInitialPage = new URLSearchParams(location.search).get('page');
if(directEditProfileChildMode){
  try{
    history.replaceState({directEditProfileBase:true},'',location.href);
    history.pushState({directEditProfileGuard:true},'',location.href);
  }catch(err){}
}
const initialPage=PAGES[requestedInitialPage] ? requestedInitialPage : 'edit_profile.html';
if(initialPage!=='edit_profile.html' && hasMergedSavedValue(initialPage)){
  if(initialPage==='add_location.html' || initialPage==='add_hometown.html') pendingSavedLocationConfirmPage=initialPage;
  else if(SAVED_CONFIRM_CONFIG[initialPage]) pendingSavedConfirmPage=initialPage;
}
openPage(initialPage,false);
