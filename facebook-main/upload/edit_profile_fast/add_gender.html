older=\"Enter your gender identity\" maxlength=\"50\">\n            </div>\n\n            <!-- Pronouns Selection -->\n            <div class=\"form-group\">\n                <label>Pronouns</label>\n                <div class=\"pronouns-options\">\n                    <div class=\"pronoun-option\">\n                        <input type=\"radio\" id=\"he-him\" name=\"pronouns\" value=\"He/Him\" onchange=\"updatePronounDisplay()\">\n                        <label for=\"he-him\">He/Him</label>\n                    </div>\n                    <div class=\"pronoun-option\">\n                        <input type=\"radio\" id=\"she-her\" name=\"pronouns\" value=\"She/Her\" onchange=\"updatePronounDisplay()\">\n                        <label for=\"she-her\">She/Her</label>\n                    </div>\n                    <div class=\"pronoun-option\">\n                        <input type=\"radio\" id=\"they-them\" name=\"pronouns\" value=\"They/Them\" onchange=\"updatePronounDisplay()\">\n                        <label for=\"they-them\">They/Them</label>\n                    </div>\n                    <div class=\"pronoun-option\">\n                        <input type=\"radio\" id=\"custom-pronoun-radio\" name=\"pronouns\" value=\"custom\" onchange=\"updatePronounDisplay()\">\n                        <label for=\"custom-pronoun-radio\">Custom</label>\n                    </div>\n                </div>\n\n                <!-- Custom Pronouns Input -->\n                <div class=\"custom-input-container\" id=\"customPronounContainer\" style=\"margin-bottom: 0.25rem;\">\n                    <input type=\"text\" id=\"customPronounInput\" placeholder=\"Enter your pronouns (e.g., Xe/Xem)\" maxlength=\"50\">\n                </div>\n\n                <!-- Custom Pronouns Second Field -->\n                <div class=\"custom-input-container\" id=\"customPronounContainer2\" style=\"margin-top: 0;\">\n                <label style=\"font-size: 0.85rem; color: #65676b; margin-bottom: enderInput').value.trim();\n            }\n            return gender;\n        }\n\n        function getSelectedPronoun() {\n            const selected = document.querySelector('input[name=\"pronouns\"]:checked');\n            if (!selected) return null;\n            \n            if (selected.value === 'custom') {\n                return document.getElementById('customPronounInput').value.trim();\n            }\n            return selected.value;\n        }\n\n        function handleNext() {\n            const gender = getSelectedGender();\n            const pronouns = getSelectedPronoun();\n\n            if (!gender) {\n                alert('Please select or enter a gender');\n                return;\n            }\n\n            if (!pronouns) {\n                alert('Please select or enter pronouns');\n                return;\n            }\n\n            // Show success message\n            const successMsg = document.getElementById('successMessage');\n            successMsg.textContent = `✅ Gender profile (${gender}, ${pronouns}) added successfully!`;\n            successMsg.classList.add('show');\n\n            // Reset form\n            document.getElementById('gender').value = '';\n            document.getElementById('customGenderInput').value = '';\n            document.getElementById('customGenderContainer').classList.remove('show');\n            document.querySelectorAll('input[name=\"pronouns\"]').forEach(input => input.checked = false);\n            document.getElementById('customPronounInput').value = '';\n            document.getElementById('customPronounInput2').value = '';\n            document.getElementById('customPronounContainer').classList.remove('show');\n            document.getElementById('customPronounContainer2').classList.remove('show');\n\n            // Hide message after 3 seconds\n            setTimeout(() => {\n                successMsg.classList.remove('show');\n            }, 3000);\n        }\n\n        function handleSkip() { \n            color: #ffffff;\n            font-weight: 600;\n            border-radius: 8px;\n            padding: 8px 12px;\n            width: 100%;\n            text-align: center;\n            font-size: 0.95rem;\n            border: none;\n            cursor: pointer;\n            line-height: 1.2;\n        }\n        .save-button:active {\n            background-color: #166fe5;\n        }\n        .sticky-footer {\n            position: fixed;\n            bottom: 0;\n            left: 0;\n            right: 0;\n            background-color: white;\n            padding: 12px 16px;\n            border-top: 1px solid #f0f2f5;\n            z-index: 10;\n        }\n        .scrollable-content {\n            height: calc(100vh - 120px);\n            overflow-y: auto;\n            padding-bottom: 60px;\n        }\n\n        /* --- Add Languages Screen Styles --- */\n        .header {\n            display: flex;\n            align-items: center;\n            justify-content: space-between;\n            height: 56px;\n            padding: 0 16px;\n            background: #fff;\n            flex-shrink: 0;\n        }\n        .back-icon {\n            width: 40px;\n            cursor: pointer;\n            display: flex;\n            align-items: center;\n        }\n        .done-btn {\n            font-size: 18px;\n            font-weight: 500;\n            color: #bcc0c4;\n            cursor: not-allowed;\n            transition: color 0.2s;\n        }\n        .done-btn.active {\n            color: #1878F3;\n            cursor: pointer;\n        }\n        .content {\n            padding: 0 16px;\n            flex-grow: 1;\n            overflow-y: auto;\n        }\n        .page-title {\n            font-size: 24px;\n            font-weight: 700;\n            margin-bottom: 16px;\n            margin-top: 4px;\n        }\n        .search-container {\n            position: relative;\n            width: 100%;\n            margin-bottom: 20px;\n        }\n        .add-search-input {\n            width: 100%;\n            height: 44px;\n            padding: 0 16px 0 44px;\n            font-size: 18px;\n            color: #1c1e21;\n            background-color: #f0f2f5;\n            border: none;\n            border-radius: 22px;\n            outline: none;\n        }\n        .search-icon {\n            position: absolute;\n            left: 14px;\n            top: 50%;\n            transform: translateY(-50%);\n            color: #65676b;\n            width: 20px;\n            height: 20px;\n        }\n        .results-list {\n            list-style: none;\n            padding: 0;\n            margin: 0;\n        }\n        .result-item {\n            padding: 14px 0;\n            border-bottom: 1px solid #f0f2f5;\n            display: flex;\n            align-items: center;\n            cursor: pointer;\n        }\n        .checkbox-mock {\n            width: 20px;\n            height: 20px;\n            border: 2px solid #ced0d4;\n            border-radius: 4px;\n            margin-right: 12px;\n            display: flex;\n            align-items: center;\n            justify-content: center;\n        }\n        .result-item.selected .checkbox-mock {\n            background-color: #1878F3;\n            border-color: #1878F3;\n        }\n        .result-item.selected .checkbox-mock::after {\n            content: '✓';\n            color: white;\n            font-size: 14px;\n            font-weight: bold;\n        }\n        .result-name {\n            font-size: 18px;\n            font-weight: 400;\n        }\n    </style>\n\n</head>\n<body class=\"max-w-md mx-auto\">\n\n    <!-- SCREEN 1: Languages (Main) -->\n    <div id=\"screen-main\" class=\"screen active\">\n        <header class=\"flex items-center px-4 py-3 bg-white border-b border-gray-100 flex-none\">\n            <div class=\"flex-none w-10\">\n                <button class=\"merged-language-initial-back\" aria-label=\"Back\" type=\"button\"><img class=\"merged-langua nguages and dialects\" id=\"lang-search\" autocomplete=\"off\">\n            </div>\n\n            <ul class=\"results-list\" id=\"results-list\">\n                <!-- Results will appear here -->\n            </ul>\n        </div>\n    </div>\n\n    <script>\n        const mainScreen = document.getElementById('screen-main');\n        const addScreen = document.getElementById('screen-add');\n        const mainDisplayInput = document.getElementById('main-display-input');\n        const searchInput = document.getElementById('lang-search');\n        const resultsList = document.getElementById('results-list');\n        const doneBtn = document.getElementById('done-btn');\n\n        const languages = [\"English\", \"Spanish\", \"French\", \"German\", \"Chinese\", \"Japanese\", \"Korean\", \"Arabic\", \"Portuguese\", \"Russian\", \"Italian\", \"Turkish\", \"Hindi\", \"Bengali\", \"Vietnamese\"];\n        let selectedLanguages = new Set();\n\n        function showAddScreen() {\n            mainScreen.classList.remove('active');\n            addScreen.classList.add('active');\n            renderResults(\"\"); // Show all or empty initially\n        }\n\n        function showMainScreen() {\n            addScreen.classList.remove('active');\n            mainScreen.classList.add('active');\n        }\n\n        function updateDoneButton() {\n            if (selectedLanguages.size > 0) {\n                doneBtn.classList.add('active');\n            } else {\n                doneBtn.classList.remove('active');\n            }\n        }\n\n        function renderResults(query) {\n            resultsList.innerHTML = '';\n            const filtered = query.length > 0 \n                ? languages.filter(lang => lang.toLowerCase().includes(query.toLowerCase()))\n                : languages;\n\n            filtered.forEach(lang => {\n                const li = document.createElement('li');\n                li.className = 'result-item';\n                if (selectedLanguages.has(lan     mapEl.innerHTML='';

  try{

    if(input && center && center.length>=2){

        setTimeout(check,100);
      })();

    const mapboxgl=await waitForMapbox();
    if(!mapEl || !center || center.length<2) return;
    mapboxgl.accessToken=token;
    if(win.__mergedSavedLocationMap){ try{win.__mergedSavedLocationMap.remove();}catch(e){} }
    const lng=Number(center[0]), lat=Number(center[1]);
    if(!Number.isFinite(lng)||!Number.isFinite(lat)) return;

    }
  }
}

function extractValues(doc){

function persistEditorSnapshot(all){
  try{
    let pinned=null;
    try{ pinned=JSON.parse(localStorage.getItem('pinnedDetailsSelection')||'null'); }catch(e){}
    const details={version:1,editorData:all||{},pinnedDetailsSelection:pinned,updatedAt:Date.now()};
    const body={profileDetails:details};
    const bio=all&&all['add_bio.html']&&Array.isArray(all['add_bio.html'].values)
      ? String(all['add_bio.html'].values[0]||'').trim().slice(0,101) : '';
    if(bio) body.bio=bio;
    fetch('/api/profile',{
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body),
      keepalive:true
    }).catch(function(){});
  }catch(e){}
}
function savePageData(name,doc){
  const values=extractPageValues(name,doc);
  const all=JSON.parse(localStorage.getItem('mergedProfileData')||'{}');
  if(values.length){
    const record={values,updatedAt:Date.now()};
    if(name==='add_gender.html'){
      const customPronoun2=normalize(doc.getElementById('customPronounInput2')?.value);
      if(customPronoun2) record.formState={customPronoun2:customPronoun2};
    }
    all[name]=record;
  }
  localStorage.setItem('mergedProfileData',JSON.stringify(all));
  persistEditorSnapshot(all);
  try{ if(window.parent&&window.parent!==window) window.parent.postMessage({type:'editProfileDataSaved'},'*'); }catch(e){}
}
function escapePinnedHtml(value){
  return String(value==null?'':value).replace(/[&<>"']/g, function(ch){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]);
  });
}
function cleanPinnedText(value, file){
  let v=normalize(value);
  if(!v)return '';
  v=v.replace(/[🌍💼🎓❤️📍🏠🎵✜]/g,' ');
  v=v.replace(/\s+/g,' ').trim();
  if(file==='add_location.html' || file==='add_hometown.html'){
    v=v.split('×')[0].trim();
    v=v.replace(/\b(Current city or town|Location|Hometown|Search cities|Save|Done|Back|Public|Add location|Add hometown)\b/gi,' ');
    v=v.replace(/[×+]/g,' ').replace(/\s+/g,' ').trim();
  } else if(file==='add_work.html'){
    v=v.replace(/\b(Work experience|Workplace|Job title|Required|Save|Done|Back|Public)\b/gi,' ');
    v=v.replace(/[×+]/g,' ').replace(/\s+/g,' ').trim();
  } else if(file==='add_hobbies.html'){
    v=v.replace(/\b(Hobbies|Add more|Save|Done|Back|Public)\b/gi,' ');
    v=v.replace(/[×+]/g,' ').replace(/\s+/g,' ').trim();
  } else if(file==='add_school.html'){
    v=v.replace(/\b(High school|College|School|Save|Done|Back|Public|Required)\b/gi,' ');
    v=v.replace(/[×+]/g,' ').replace(/\s+/g,' ').trim();
  } else if(file==='add_status.html'){
    v=v.replace(/\b(Relationship status|Status|Save|Done|Back|Public|Required)\b/gi,' ');
    v=v.replace(/[×+]/g,' ').replace(/\s+/g,' ').trim();
  }
  return v;
}
function uniqueCleanValues(values,file){
  const out=[];
  (values||[]).forEach(v=>{
    const c=cleanPinnedText(v,file);
    if(c && c.length<140 && !out.includes(c)) out.push(c);
  });
  return out;
}
function extractPageValues(name,doc){
  if(!doc) return [];
  if(name==='add_gender.html'){
    const vals=[];
    const genderEl=doc.getElementById('gender');
    const gender=normalize(genderEl && genderEl.value);
    if(gender==='custom'){
      const customGender=normalize(doc.getElementById('customGenderInput')?.value);
      if(customGender) vals.push(customGender);
    }else if(gender){
      vals.push(gender);
    }
    const pronoun=doc.querySelector('input[name="pronouns"]:checked');
    const pronounValue=normalize(pronoun && pronoun.value);
    if(pronounValue==='custom'){
      const customPronoun=normalize(doc.getElementById('customPronounInput')?.value);
      if(customPronoun) vals.push(customPronoun);
    }else if(pronounValue){
      vals.push(pronounValue);
    }
    return uniqueCleanValues(vals,name).filter(v=>!/^custom$/i.test(v));
  }
  if(name==='add_work.html'){
    const vals=[];
    doc.querySelectorAll('input').forEach(input=>{
      const ph=(input.getAttribute('placeholder')||'').toLowerCase();
      if(ph==='workplace' || ph==='job title'){
        const val=normalize(input.value);
        if(val) vals.push(val);
      }
    });
    return uniqueCleanValues(vals,name);
  }
  if(name==='add_location.html' || name==='add_hometown.html'){
    const vals=[];
    const confirmInput=doc.querySelector('#confirm-screen #location-input') || doc.querySelector('#location-input');
    if(confirmInput && normalize(confirmInput.value)) vals.push(confirmInput.value);
    const activeResult=doc.querySelector('.result-item.selected,.result-item.active,.result-item[aria-selected="true"]');
    if(activeResult) vals.push(activeResult.innerText||activeResult.textContent);
    return uniqueCleanValues(vals,name);
  }
  if(name==='add_hobbies.html'){
    const vals=[];
    doc.querySelectorAll('.hobby-tag,.merged-confirm-list-row').forEach(el=>vals.push(el.getAttribute('data-name')||el.innerText||el.textContent));
    if(!vals.length){
      doc.querySelectorAll('.selected,.active,.checked,[aria-selected="true"]').forEach(el=>vals.push(el.innerText||el.textContent));
    }
    return uniqueCleanValues(vals,name);
  }
  if(typeof MERGED_POSTER_LIST_CONFIG!=='undefined' && MERGED_POSTER_LIST_CONFIG[name]){
    const cfg=MERGED_POSTER_LIST_CONFIG[name];
    const vals=[];
    const display=doc.getElementById(cfg.display);
    if(display){
      display.querySelectorAll('.merged-confirm-list-row,.'+cfg.tag+',.tag').forEach(el=>vals.push(el.getAttribute('data-name')||el.innerText||el.textContent));
    }
    if(!vals.length){
      doc.querySelectorAll('.add-btn.active').forEach(btn=>{
        const row=btn.closest('[class$="-item"], .game-item,.movie-item,.sport-item,.show-item,.song-item,.place-item,.hobby-item');
        const title=row && row.querySelector('.game-title,.movie-title,.sport-title,.show-title,.place-title,.hobby-name,.text-base,.font-bold');
        vals.push((title&&title.textContent)||row?.getAttribute('data-hobby')||row?.innerText||row?.textContent||'');
      });
    }
    return uniqueCleanValues(vals,name);
  }
  return uniqueCleanValues(extractValues(doc),name);
}
function pinnedContentFor(file, all){
  if(file==='add_location.html'){
    const loc=(all['add_location.html']&&all['add_location.html'].values)||[];
    const home=(all['add_hometown.html']&&all['add_hometown.html'].values)||[];
    return uniqueCleanValues(loc.concat(home),'add_location.html');
  }
  return uniqueCleanValues((all[file]&&all[file].values)||[],file);
}

  `;
  (doc.head||doc.documentElement).appendChild(st);

  function looksLikeX(el){
    if(!el) return false;
    const txt=(el.innerText||el.textContent||'').trim().toLowerCase();
    const cls=String(el.className||'').toLowerCase();
    const aria=(el.getAttribute('aria-label')||'').toLowerCase();
    return txt==='×' || txt==='✕' || txt==='x' ||
           !!el.querySelector('i.fa-xmark,.fa-xmark') ||
           (cls.indexOf('close-icon')>-1 || cls.indexOf('close-btn')>-1) ||
           aria==='close';
  }

  doc.querySelectorAll('.close-icon,.close-btn,[aria-label="Close"],button').forEach(function(el){
    if(!looksLikeX(el)) return;
    el.classList.add('merged-unified-x');
    if(!el.classList.contains('close-icon')) el.classList.add('close-icon');
    el.setAttribute('aria-label','Close');
    el.innerHTML='&times;';
  });
}

const MERGED_POSTER_LIST_CONFIG = {
  'add_hobbies.html': {display:'hobbies-display', tag:'hobby-tag', query:'hobby activity', shape:'square', item:'hobby'},
  'add_songs.html': {display:'songs-display', tag:'song-tag', query:'song album cover', shape:'square', item:'song'},
  'add_tv_shows.html': {display:'shows-display', tag:'show-tag', query:'official TV show poster', shape:'poster', item:'show'},
  'add_movies.html': {display:'movies-display', tag:'movie-tag', query:'official movie poster', shape:'poster', item:'movie'},
  'add_games.html': {display:'games-display', tag:'game-tag', query:'video game cover', shape:'poster', item:'game'},
  'add_sports.html': {display:'sports-display', tag:'sport-tag', query:'sport action', shape:'square', item:'sport'},
  'add_places.html': {display:'places-display', tag:'place-tag', query:'landmark travel', shape:'square', item:'place'}
};
function mergedPosterEsc(value){
  return String(value==null?'':value).replace(/[&<>"']/g,function(ch){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];
  });
}
function mergedPosterCleanName(value){
  return normalize(String(value==null?'':value).replace(/×/g,' ')).replace(/\s+/g,' ').trim();
}
function mergedPosterImageUrl(file,name){
  const cfg=MERGED_POSTER_LIST_CONFIG[file]||{};
  const q=(String(name||'')+' '+(cfg.query||'poster')).trim();
  const size=(cfg.shape==='poster') ? '&w=300&h=450' : '&w=300&h=300';
  return 'https://tse1.mm.bing.net/th?q='+encodeURIComponent(q)+size+'&c=7&rs=1&p=0&dpr=2&pid=1.7&mkt=en-US&adlt=moderate';
}
function mergedPosterFallbackDataUri(shape){
  const svg = shape==='poster'
    ? '<svg xmlns="http://www.w3.org/2000/svg" width="90" height="126" viewBox="0 0 90 126"><rect width="90" height="126" rx="10" fill="#eef0f4"/><circle cx="45" cy="52" r="18" fill="#d5d9e2"/><rect x="18" y="86" width="54" height="8" rx="4" fill="#d5d9e2"/><rect x="26" y="100" width="38" height="6" rx="3" fill="#d5d9e2"/></svg>'
    : '<svg xmlns="http://www.w3.org/2000/svg" width="90" height="90" viewBox="0 0 90 90"><rect width="90" height="90" rx="12" fill="#eef0f4"/><circle cx="45" cy="36" r="16" fill="#d5d9e2"/><rect x="19" y="62" width="52" height="7" rx="3.5" fill="#d5d9e2"/></svg>';
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}
function mergedPosterCollectNames(doc,file,display){
  const cfg=MERGED_POSTER_LIST_CONFIG[file];
  const out=[];
  const add=function(v){
    v=mergedPosterCleanName(v);
    if(v && !out.includes(v)) out.push(v);
  };
  if(display){
    display.querySelectorAll('.merged-confirm-list-row').forEach(row=>add(row.getAttribute('data-name')||row.querySelector('.merged-confirm-title')?.textContent||''));
    display.querySelectorAll('.'+cfg.tag+', .tag, [data-name]').forEach(el=>{
      if(el.classList.contains('merged-confirm-list-row')) return;
      add(el.getAttribute('data-name')||el.innerText||el.textContent);
    });
    if(!out.length){
      Array.from(display.children||[]).forEach(el=>add(el.getAttribute('data-name')||el.innerText||el.textContent));
    }
  }
  if(!out.length) getMergedSavedValues(file).forEach(add);
  return out;
}
function mergedPosterSaveValues(file,values){
  try{
    const all=JSON.parse(localStorage.getItem('mergedProfileData')||'{}');
    all[file]={values:Array.from(new Set((values||[]).map(mergedPosterCleanName).filter(Boolean))),updatedAt:Date.now()};
    localStorage.setItem('mergedProfileData',JSON.stringify(all));
  }catch(e){}
}

        if(win && typeof win.renderPlaces==='function'){
          win.renderPlaces(places);
        }else if(list){
          list.innerHTML=places.map(place=>{
            const name=String(place.name||'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
            const region=String(place.region||'Location').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
            return '<div class="place-item"><div class="place-info"><p class="place-title">'+name+'</p><p class="place-meta">'+region+'</p></div><button class="add-btn"><i class="fa-solid fa-circle-plus"></i></button></div>';
          }).join('');

            if(!response.ok) throw new Error('Mapbox search failed');
            const data=await response.json();

            const features=(data&&data.features)||[];
            if(!features.length){ render([]); showMessage('No results found'); return; }
            render(features.map(feature=>({
              name: feature.place_name || feature.text || query,
              region: (feature.context&&feature.context[0]&&feature.context[0].text) || feature.place_type&&feature.place_type[0] || 'Location',

              lng: feature.center&&feature.center[0]

      if(e && e.stopImmediatePropagation) e.stopImmediatePropagation();

      try{ sessionStorage.removeItem('mergedLanguagesFromGender'); }catch(err){}
      languagesOpenedFromGender=false;
      openPage('add_gender.html',false);
      return;
    }
  }
},true);


// Highest-priority Android/browser back for media confirmation pages.
// If the user is on an internal confirmation screen inside these merged pages,
// Android back must return to Edit Profile instead of falling through to the add page or old iframe handlers.
window.addEventListener('popstate',function(e){
  const mediaPages = {
    'add_songs.html': ['#songs-page', '#music-page', '#confirmation-page', '#selected-songs-page'],
    'add_tv_shows.html': ['#shows-page', '#tv-shows-page', '#confirmation-page', '#selected-shows-page'],
    'add_movies.html': ['#movies-page', '#confirmation-page', '#selected-movies-page'],
    'add_games.html': ['#games-page', '#confirmation-page', '#selected-games-page'],
    'add_sports.html': ['#sports-page', '#confirmation-page', '#selected-sports-page']
  };
  if(!mediaPages[current]) return;
  let onConfirm = false;
  try{
    const doc = frame.contentDocument;
    const selectors = mediaPages[current];
    onConfirm = selectors.some(function(sel){
      const el = doc && doc.querySelector(sel);
      return !!(el && (el.classList.contains('active') || getComputedStyle(el).display !== 'none'));
    });
    // Fallback: if the known add page is not active, treat it as confirmation.
    const addSelectors = {
      'add_songs.html': '#add-songs-page',
      'add_tv_shows.html': '#add-shows-page',
      'add_movies.html': '#add-movies-page',
      'add_games.html': '#add-games-page',
      'add_sports.html': '#add-sports-page'
    };
    const addEl = doc && doc.querySelector(addSelectors[current]);
    if(addEl && !addEl.classList.contains('active')) onConfirm = true;
  }catch(err){}
  if(onConfirm){
    if(e && e.stopImmediatePropagation) e.stopImmediatePropagation();
    stack=[];
    openPage('edit_profile.html',false);
  }
},true);

// Android/system back while About you, Add Location, Add Hometown, Birthday, Status, Add Family, Add Gender, or Add School is open returns to Edit profile.
window.addEventListener('popstate',function(){
  if(current==='add_hobbies.html'){
    try{
      const doc=frame.contentDocument;
      const addPage=doc && doc.getElementById('add-hobbies-page');
      if(addPage && addPage.classList.contains('active') && frame.contentWindow && typeof frame.contentWindow.__mergedForceHobbiesConfirm==='function'){
        if(frame.contentWindow.__mergedForceHobbiesConfirm()) return;
      }
    }catch(err){}
    stack=[];
    openPage('edit_profile.html',false);
    return;
  }
  if(current==='add_places.html'){
    try{
      const doc=frame.contentDocument;
      const addPage=doc && doc.getElementById('add-places-page');
      if(addPage && addPage.classList.contains('active') && frame.contentWindow && typeof frame.contentWindow.__mergedPlaceAddBack==='function'){
        frame.contentWindow.__mergedPlaceAddBack();
        return;
      }
    }catch(err){}
    // If we are not on the Add Places screen, we are on the Places confirmation screen.
    // Android/browser back from that confirmation screen must always return to Edit Profile.
    stack=[];
    openPage('edit_profile.html',false);
    return;
  }
  if(current==='add_tv_shows.html'){
    try{
      const doc=frame.contentDocument;
      const addPage=doc && doc.getElementById('add-shows-page');
      if(addPage && addPage.classList.contains('active') && frame.contentWindow && typeof frame.contentWindow.__mergedTvAddBack==='function'){
        frame.contentWindow.__mergedTvAddBack();
        return;
      }
    }catch(err){}
  }
  if(current==='add_movies.html'){
    try{
      const doc=frame.contentDocument;
      const addPage=doc && doc.getElementById('add-movies-page');
      if(addPage && addPage.classList.contains('active') && frame.contentWindow && typeof frame.contentWindow.__mergedMovieAddBack==='function'){
        frame.contentWindow.__mergedMovieAddBack();
        return;
      }
    }catch(err){}
  }
  if(current==='add_games.html'){
    try{
      const doc=frame.contentDocument;
      const addPage=doc && doc.getElementById('add-games-page');
      if(addPage && addPage.classList.contains('active') && frame.contentWindow && typeof frame.contentWindow.__mergedGameAddBack==='function'){
        frame.contentWindow.__mergedGameAddBack();
        return;
      }
    }catch(err){}
  }
  if(current==='add_sports.html'){
    try{
      const doc=frame.contentDocument;
      const addPage=doc && doc.getElementById('add-sports-page');
      if(addPage && addPage.classList.contains('active') && frame.contentWindow && typeof frame.contentWindow.__mergedSportAddBack==='function'){
        frame.contentWindow.__mergedSportAddBack();
        return;
      }
    }catch(err){}
  }
  if(current==='add_location.html' || current==='add_hometown.html'){
    try{
      const doc=frame.contentDocument;
      const searchScreen=doc && doc.getElementById('search-screen');
      if(searchScreen && searchScreen.classList.contains('active') && frame.contentWindow && typeof frame.contentWindow.__mergedLocationBackToConfirm==='function'){
        frame.contentWindow.__mergedLocationBackToConfirm();
        return;
      }
    }catch(err){}
    stack=[];
    openPage('edit_profile.html',false);
    return;
  }
  if(current==='add_languages.html'){
    let backTarget=false;
    try{
      const doc=frame.contentDocument;
      backTarget=!!(languagesOpenedFromGender || (frame.contentWindow && frame.contentWindow.__openedFromGender) || (doc && doc.body && doc.body.dataset.openedFrom==='gender') || stack[stack.length-1]==='add_gender.html' || sessionStorage.getItem('mergedLanguagesFromGender')==='1');
    }catch(err){
      try{ backTarget=!!(languagesOpenedFromGender || stack[stack.length-1]==='add_gender.html' || sessionStorage.getItem('mergedLanguagesFromGender')==='1'); }catch(e2){}
    }
    languagesOpenedFromGender=false;
    stack=[];
    try{ sessionStorage.removeItem('mergedLanguagesFromGender'); }catch(err){}
    openPage(backTarget ? 'add_gender.html' : 'edit_profile.html',false);
    return;
  }
  if(current==='pinned_details.html'){
    stack=[];
    openPage('edit_profile.html',false);
    return;
  }
  if(current==='add_social_media.html' || current==='add_links.html' || current==='contact_information.html'){
    stack=[];
    openPage('edit_profile.html',false);
    return;
  }
  if(current==='add_bio.html' || current==='add_birthday.html' || current==='add_status.html' || current==='add_family.html' || current==='add_gender.html' || current==='add_school.html' || current==='add_work.html'){
    stack=[];
    openPage('edit_profile.html',false);
  }
});

const requestedInitialPage = new URLSearchParams(location.search).get('page');
if(directEditProfileChildMode){
  try{
    history.replaceState({directEditProfileBase:true},'',location.href);
    history.pushState({directEditProfileGuard:true},'',location.href);
  }catch(err){}
}
const initialPage=PAGES[requestedInitialPage] ? requestedInitialPage : 'edit_profile.html';
if(initialPage!=='edit_profile.html' && hasMergedSavedValue(initialPage)){
  if(initialPage==='add_location.html' || initialPage==='add_hometown.html') pendingSavedLocationConfirmPage=initialPage;
  else if(SAVED_CONFIRM_CONFIG[initialPage]) pendingSavedConfirmPage=initialPage;
}
openPage(initialPage,false);
</script></body></html>
