<!DOCTYPE html>
<html lang="en">
<head><script>window.alert=function(){};</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gender and pronouns</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background-color: #ffffff;
            color: #1c1e21;
            line-height: 1.5;
        }

        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 1.5rem 1.5rem 0.5rem 1.5rem;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.35rem;
            cursor: pointer;
            color: #1c1e21;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 1.65rem;
            height: 1.65rem;
            line-height: 1;
            transition: opacity 0.2s;
        }

        .close-btn:hover {
            opacity: 0.7;
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 1rem 1.5rem;
            max-width: 600px;
        }

        h1 {
            font-size: 1.875rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: #1c1e21;
        }

        .description {
            font-size: 0.95rem;
            color: #65676b;
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }

        .description a {
            color: #0a66c2;
            text-decoration: none;
            font-weight: 500;
        }

        .description a:hover {
            text-decoration: underline;
        }

        .form-group {
            margin-bottom: 0.75rem;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: #1c1e21;
            margin-bottom: 0.5rem;
        }

        .form-group select,
        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            border: 1px solid #ccc;
            border-radius: 0.5rem;
            outline: none;
            transition: border-color 0.2s;
            background-color: #fff;
            font-family: inherit;
        }

        .form-group select:focus,
        .form-group input:focus {
            border-color: #0a66c2;
        }

        .form-group select {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231c1e21' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 0.75rem center;
            background-size: 1.25rem;
            padding-right: 2.5rem;
        }

        .pronouns-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            margin-top: 0.5rem;
        }

        .pronoun-option {
            display: flex;
            align-items: center;
        }

        .pronoun-option input[type="radio"] {
            width: auto;
            margin-right: 0.5rem;
            cursor: pointer;
        }

        .pronoun-option label {
            margin: 0;
            font-weight: 500;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .custom-input-container {
            margin-top: 0.5rem;
            margin-bottom: 0.75rem;
            display: none;
        }

        .custom-input-container input {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 0.9rem;
            border: 1px solid #ccc;
            border-radius: 0.5rem;
            outline: none;
        }

        .custom-input-container input:focus {
            border-color: #0a66c2;
        }

        .custom-input-container.show {
            display: block;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            padding-top: 1rem;
            margin-top: auto;
        }

        .next-btn {
            background-color: #0a66c2;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 2rem;
            cursor: pointer;
            transition: background-color 0.2s;
            height: auto;
        }

        .next-btn:hover {
            background-color: #054399;
        }

        .next-btn:active {
            transform: scale(0.97);
        }

        .skip-btn {
            background: none;
            border: none;
            color: #1c1e21;
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            font-size: 0.95rem;
            cursor: pointer;
            border-radius: 2rem;
            transition: background-color 0.2s;
        }

        .skip-btn:hover {
            background-color: #f0f2f5;
        }

        .success-message {
            display: none;
            padding: 1rem;
            background-color: #e5ffe5;
            border: 1px solid #ccffcc;
            border-radius: 0.5rem;
            color: #1e7e1e;
            margin-bottom: 1rem;
            text-align: center;
        }

        .success-message.show {
            display: block;
        }

        @media (max-width: 640px) {
            h1 {
                font-size: 1.5rem;
            }

            .content {
                padding: 1rem;
            }

            .header {
                padding: 1rem 1rem 0.5rem 1rem;
            }

            .pronouns-options {
                grid-template-columns: 1fr;
            }
        }
    </style>

</head>
<body>
    <div class="container">
        <div class="header">
            <button class="close-btn" onclick="closeModal()">✕</button>
        </div>

        <div class="content">
            <div class="success-message" id="successMessage">
                ✅ Gender profile added successfully!
            </div>

            <h1>Gender and pronouns</h1>

            <p class="description">
                Help us personalize your experience by sharing your gender identity and pronouns. This information helps us provide more inclusive and relevant content. <a href="#">Learn more</a>
            </p>

            <!-- Gender Selection -->
            <div class="form-group">
                <label for="gender">Gender</label>
                <select id="gender" onchange="handleGenderChange()">
                    <option value="">Select gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="non-binary">Non-binary</option>
                    <option value="prefer-not-to-say">Prefer not to say</option>
                    <option value="custom">Custom</option>
                </select>
            </div>

            <!-- Custom Gender Input -->
            <div class="custom-input-container" id="customGenderContainer">
                <input type="text" id="customGenderInput" placeholder="Enter your gender identity" maxlength="50">
            </div>

            <!-- Pronouns Selection -->
            <div class="form-group">
                <label>Pronouns</label>
                <div class="pronouns-options">
                    <div class="pronoun-option">
                        <input type="radio" id="he-him" name="pronouns" value="He/Him" onchange="updatePronounDisplay()">
                        <label for="he-him">He/Him</label>
                    </div>
                    <div class="pronoun-option">
                        <input type="radio" id="she-her" name="pronouns" value="She/Her" onchange="updatePronounDisplay()">
                        <label for="she-her">She/Her</label>
                    </div>
                    <div class="pronoun-option">
                        <input type="radio" id="they-them" name="pronouns" value="They/Them" onchange="updatePronounDisplay()">
                        <label for="they-them">They/Them</label>
                    </div>
                    <div class="pronoun-option">
                        <input type="radio" id="custom-pronoun-radio" name="pronouns" value="custom" onchange="updatePronounDisplay()">
                        <label for="custom-pronoun-radio">Custom</label>
                    </div>
                </div>

                <!-- Custom Pronouns Input -->
                <div class="custom-input-container" id="customPronounContainer" style="margin-bottom: 0.25rem;">
                    <input type="text" id="customPronounInput" placeholder="Enter your pronouns (e.g., Xe/Xem)" maxlength="50">
                </div>

                <!-- Custom Pronouns Second Field -->
                <div class="custom-input-container" id="customPronounContainer2" style="margin-top: 0;">
                <label style="font-size: 0.85rem; color: #65676b; margin-bottom: 0.25rem;">How do you use these pronouns?</label>
                <input type="text" id="customPronounInput2" placeholder="e.g., Xe is a great person, I like xem" maxlength="100">
            </div>

            <div class="button-group">
                <button class="next-btn" onclick="handleNext()">Next</button>
                <button class="skip-btn" onclick="handleSkip()">Skip for now</button>
            </div>
        </div>
    </div>

    <script>
        function handleGenderChange() {
            const gender = document.getElementById('gender').value;
            const customGenderContainer = document.getElementById('customGenderContainer');
            
            if (gender === 'custom') {
                customGenderContainer.classList.add('show');
                document.getElementById('customGenderInput').focus();
            } else {
                customGenderContainer.classList.remove('show');
                document.getElementById('customGenderInput').value = '';
            }
        }

        function updatePronounDisplay() {
            const customContainer = document.getElementById('customPronounContainer');
            const customContainer2 = document.getElementById('customPronounContainer2');
            const customRadio = document.getElementById('custom-pronoun-radio');
            
            if (customRadio.checked) {
                customContainer.classList.add('show');
                customContainer2.classList.add('show');
                document.getElementById('customPronounInput').focus();
            } else {
                customContainer.classList.remove('show');
                customContainer2.classList.remove('show');
            }
        }

        function getSelectedGender() {
            const gender = document.getElementById('gender').value;
            
            if (gender === 'custom') {
                return document.getElementById('customGenderInput').value.trim();
            }
            return gender;
        }

        function getSelectedPronoun() {
            const selected = document.querySelector('input[name="pronouns"]:checked');
            if (!selected) return null;
            
            if (selected.value === 'custom') {
                return document.getElementById('customPronounInput').value.trim();
            }
            return selected.value;
        }

        function handleNext() {
            const gender = getSelectedGender();
            const pronouns = getSelectedPronoun();

            if (!gender) {
                alert('Please select or enter a gender');
                return;
            }

            if (!pronouns) {
                alert('Please select or enter pronouns');
                return;
            }

            // Show success message
            const successMsg = document.getElementById('successMessage');
            successMsg.textContent = `✅ Gender profile (${gender}, ${pronouns}) added successfully!`;
            successMsg.classList.add('show');

            // Reset form
            document.getElementById('gender').value = '';
            document.getElementById('customGenderInput').value = '';
            document.getElementById('customGenderContainer').classList.remove('show');
            document.querySelectorAll('input[name="pronouns"]').forEach(input => input.checked = false);
            document.getElementById('customPronounInput').value = '';
            document.getElementById('customPronounInput2').value = '';
            document.getElementById('customPronounContainer').classList.remove('show');
            document.getElementById('customPronounContainer2').classList.remove('show');

            // Hide message after 3 seconds
            setTimeout(() => {
                successMsg.classList.remove('show');
            }, 3000);
        }

        function handleSkip() {
            alert('Skipping gender profile...');
        }

        function closeModal() {
            alert('Close button clicked');
        }
    </script>
</body>
</html>
