<!DOCTYPE html>
<html lang="en">
<head><script>window.alert=function(){};</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Intro Bio Page - Refined Input</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');
        
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: -webkit-fill-available;
            color: #1c1e21;
            overflow: hidden;
        }
        
        html {
            height: -webkit-fill-available;
        }
        
        /* Header */
        .header {
            display: flex;
            align-items: center;
            height: 56px;
            padding: 0 16px;
            background: #fff;
            flex-shrink: 0;
        }
        .close-icon {
            font-size: 28px;
            font-weight: 300;
            color: #1c1e21;
            cursor: pointer;
            width: 40px;
        }
        .header-title {
            flex-grow: 1;
            text-align: center;
            font-size: 20px;
            font-weight: 700;
            margin-right: 40px;
        }
        
        /* Content Area */
        .content {
            padding: 16px;
            flex-grow: 1;
            overflow-y: auto;
        }
        
        .section-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 16px;
        }
        
        /* Compact Input Container */
        .input-container {
            border: 1px solid #ced0d4;
            border-radius: 12px;
            padding: 8px 16px; /* Tighter padding to keep height low */
            background-color: #fff;
            margin-bottom: 8px;
            transition: border-color 0.2s;
            display: flex;
            flex-direction: column;
            min-height: 80px; /* Maintains the original box height */
        }
        
        .input-container:focus-within {
            border-color: #1878F3;
        }
        
        .persistent-label {
            font-size: 14px; /* Slightly smaller to save space */
            color: #65676b;
            margin-bottom: 2px;
            pointer-events: none;
            transition: color 0.2s;
        }
        
        /* Label turns blue when typing or focused */
        .input-container:focus-within .persistent-label {
            color: #1878F3;
        }
        
        .bio-textarea {
            width: 100%;
            flex-grow: 1;
            font-size: 18px;
            color: #1c1e21;
            border: none;
            outline: none;
            resize: none;
            background-color: transparent;
            padding: 0;
            display: block;
            line-height: 1.2;
        }
        
        .status-row {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #65676b;
            font-size: 14px;
        }
        
        .globe-icon {
            width: 14px;
            height: 14px;
        }
        
        /* Footer Button */
        .footer {
            padding: 12px 16px;
            padding-bottom: 12px;
            flex-shrink: 0;
            background-color: #ffffff;
        }
        
        .save-button {
            width: 100%;
            height: 36px;
            background-color: #e4e6eb;
            color: #bcc0c4;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: not-allowed;
            transition: all 0.2s ease;
        }
        
        .save-button.active {
            background-color: #1878F3;
            color: #ffffff;
            cursor: pointer;
        }
    </style>

</head>
<body>
    <div class="header">
        <div class="close-icon">&times;</div>
        <div class="header-title">Intro</div>
    </div>

    <div class="content">
        <div class="section-title">Add a bio</div>
        
        <div class="input-container" onclick="document.getElementById('bio-input').focus()">
            <div class="persistent-label" id="label-text">Introduce yourself</div>
            <textarea class="bio-textarea" id="bio-input" maxlength="101"></textarea>
        </div>
        
        <div class="status-row">
            <svg class="globe-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
            </svg>
            <span>Public · <span id="char-count">0</span>/101</span>
        </div>
    </div>

    <div class="footer">
        <button class="save-button" id="save-btn" disabled>Save</button>
    </div>

    <script>
        const bioInput = document.getElementById('bio-input');
        const charCount = document.getElementById('char-count');
        const saveBtn = document.getElementById('save-btn');

        bioInput.addEventListener('input', () => {
            const length = bioInput.value.length;
            charCount.innerText = length;
            
            if (length > 0) {
                saveBtn.classList.add('active');
                saveBtn.disabled = false;
            } else {
                saveBtn.classList.remove('active');
                saveBtn.disabled = true;
            }
        });
    </script>
</body>
</html>
