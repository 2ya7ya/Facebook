<!DOCTYPE html>
<html lang="en">
<head><script>window.alert=function(){};</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Your Birthday</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            height: 100vh;
            height: 100dvh;
        }
        #root {
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .input-focus-within:focus-within {
            border-color: #000;
        }
    </style>

</head>
<body class="bg-white text-black">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const EditBirthdayPage = () => {
            const originalBirthday = "December 16, 2001";
            const [birthday, setBirthday] = useState(originalBirthday);
            const hasChanges = birthday !== originalBirthday;

            const handleSave = () => {
                console.log("Saving birthday:", birthday);
                alert("Birthday saved: " + birthday);
            };

            return (
                <div style={{ display: 'flex', flexDirection: 'column', height: '100%', maxWidth: '28rem', margin: '0 auto', width: '100%' }}>
                    {/* Main content area - grows to fill available space */}
                    <div style={{ flex: 1, overflowY: 'auto', padding: '1rem' }}>
                        {/* Header */}
                        <div style={{ marginBottom: '1.5rem' }}>
                            <button style={{ padding: '0.25rem', marginLeft: '-0.25rem', background: 'none', border: 'none', cursor: 'pointer' }} aria-label="Go back">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                    <path d="m15 18-6-6 6-6"/>
                                </svg>
                            </button>
                        </div>

                        {/* Content */}
                        <h1 style={{ fontSize: '1.875rem', fontWeight: 'bold', marginBottom: '0.75rem', letterSpacing: '-0.02em' }}>Edit your birthday</h1>
                        <p style={{ fontSize: '0.9375rem', color: '#1f2937', lineHeight: '1.4', marginBottom: '2rem' }}>
                            This birthday is used for the accounts and profiles in this Accounts Center. Any changes you make will apply to all of them.
                        </p>

                        {/* Input Field */}
                        <div style={{ 
                            position: 'relative', 
                            border: '1px solid #d1d5db', 
                            borderRadius: '1rem', 
                            padding: '1rem', 
                            display: 'flex', 
                            justifyContent: 'space-between', 
                            alignItems: 'center'
                        }} className="input-focus-within">
                            <div style={{ display: 'flex', flexDirection: 'column', flex: 1 }}>
                                <label style={{ fontSize: '0.75rem', color: '#6b7280', fontWeight: '500', marginBottom: '0.125rem' }}>Birthday</label>
                                <input 
                                    type="text" 
                                    value={birthday} 
                                    onChange={(e) => setBirthday(e.target.value)}
                                    style={{ 
                                        fontSize: '1.0625rem', 
                                        fontWeight: '400', 
                                        outline: 'none', 
                                        background: 'transparent', 
                                        width: '100%',
                                        border: 'none'
                                    }}
                                />
                            </div>
                            <button 
                                onClick={() => setBirthday('')}
                                style={{ 
                                    color: '#9ca3af', 
                                    background: 'none',
                                    border: 'none',
                                    cursor: 'pointer',
                                    flexShrink: 0,
                                    marginLeft: '0.5rem',
                                    padding: '0.25rem'
                                }}
                                aria-label="Clear input"
                            >
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                    <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    {/* Footer Button - fixed at bottom */}
                    <div style={{ 
                        borderTop: '1px solid #e5e7eb', 
                        backgroundColor: '#ffffff',
                        padding: '1rem',
                        flexShrink: 0
                    }}>
                        <button 
                            onClick={handleSave}
                            disabled={!hasChanges}
                            style={{
                                width: '100%',
                                fontWeight: '600',
                                padding: '0.875rem',
                                borderRadius: '9999px',
                                textAlign: 'center',
                                border: 'none',
                                cursor: hasChanges ? 'pointer' : 'not-allowed',
                                backgroundColor: hasChanges ? '#1878F3' : '#d1d5db',
                                color: hasChanges ? '#ffffff' : '#9ca3af',
                                transition: 'background-color 0.2s'
                            }}
                            onMouseEnter={(e) => {
                                if (hasChanges) e.target.style.backgroundColor = '#0d5fd8';
                            }}
                            onMouseLeave={(e) => {
                                if (hasChanges) e.target.style.backgroundColor = '#1878F3';
                            }}
                        >
                            Save
                        </button>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<EditBirthdayPage />);
    </script>
</body>
</html>
