name: Build Native Android App

on:
  workflow_dispatch:
  push:
    paths:
      - "android-gallery-app/**"
      - ".github/workflows/build-android-gallery.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build native debug APK
        working-directory: android-gallery-app
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload native APK
        uses: actions/upload-artifact@v4
        with:
          name: ok-plus-native-android-debug
          path: android-gallery-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
