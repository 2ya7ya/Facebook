    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Work</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }
        .header-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #050505;
        }
        .input-group {
            margin-top: 12px;
        }
        .input-field {
            border: 1px solid #ced0d4;
            border-radius: 10px;
            padding: 14px 16px;
            width: 100%;
            font-size: 1.1rem;
            color: #050505;
            background-color: #ffffff;
        }
        .input-field::placeholder {
            color: #65676b;
        }
        .required-text {
            font-size: 0.85rem;
            color: #65676b;
            margin-top: 8px;
            margin-bottom: 4px;
        }
        .save-button {
            background-color: #e4e6eb; /* Disabled color as shown in screenshot */
            color: #bcc0c4;
            font-weight: 600;
            border-radius: 8px;
            padding: 8px 12px;
            width: 100%;
            text-align: center;
            font-size: 0.95rem;
            border: none;
            cursor: not-allowed;
            line-height: 1.2;
        }
        .save-button.active {
            background-color: #1877f2;
            color: #ffffff;
            cursor: pointer;
        }
        .sticky-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: white;
            padding: 12px 16px;
            border-top: 1px solid #f0f2f5;
            z-index: 10;
        }
        .scrollable-content {
            height: calc(100vh - 120px);
            overflow-y: auto;
            padding-bottom: 60px;
        }
    </style>

</head>
<body class="flex flex-col h-screen max-w-md mx-auto">

    <!-- Header -->
    <header class="flex items-center px-4 py-3 bg-white border-b border-gray-100 flex-none">
        <div class="flex-none w-10">
            <button class="merged-initial-x close-icon merged-unified-x" aria-label="Close" type="button">&times;</button>
        </div>
        <div class="flex-grow text-center">
            <h1 class="header-title">Work</h1>
        </div>
        <div class="flex-none w-10"></div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow px-4 scrollable-content">
        <div class="input-group">
            <input type="text" placeholder="Workplace" class="input-field outline-none">
        </div>
        
        <div class="required-text">Required</div>
        
        <div class="input-group">
            <input type="text" placeholder="Job title" class="input-field outline-none">
        </div>
    </main>

    <!-- Fixed Footer -->
    <footer class="sticky-footer">
        <button class="save-button">
            Save
        </button>
    </footer>

    <script>
        // Simple logic to activate button if both fields are filled
        const inputs = document.querySelectorAll('.input-field');
        const saveBtn = document.querySelector('.save-button');

        inputs.forEach(input => {
            input.addEventListener('input', () => {
                const allFilled = Array.from(inputs).every(i => i.value.trim() !== '');
                if (allFilled) {
                    saveBtn.classList.add('active');
                } else {
                    saveBtn.classList.remove('active');
                }
            });
        });
    </script>

</body>
</html>
