    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Games</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
        }
        .search-container {
            background-color: #f0f2f5;
            border-radius: 20px;
        }
        .game-item {
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
        }
        .game-item:active {
            background-color: #f0f2f5;
        }
        .game-image {
            width: 48px;
            height: 64px;
            border-radius: 6px;
            object-fit: cover;
            flex-shrink: 0;
            background-color: #e4e6eb;
        }
        .game-info {
            flex: 1;
            min-width: 0;
        }
        .game-title {
            font-size: 14px;
            font-weight: bold;
            margin: 0;
        }
        .game-meta {
            font-size: 12px;
            color: #65676b;
            margin: 2px 0 0 0;
        }
        .add-btn {
            color: #9ca3af;
            font-size: 20px;
            cursor: pointer;
            transition: color 0.2s;
            border: none;
            background: none;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .add-btn:hover {
            color: #4b5563;
        }
        .add-btn.active {
            color: #0a66c2;
        }
        .selected-count {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #0a66c2;
            color: white;
            padding: 12px 16px;
            border-radius: 20px;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            display: none;
        }
        .selected-count.show {
            display: block;
        }
        .page {
            display: none;
        }
        .page.active {
            display: block;
        }
        .game-tag {
            display: inline-block;
            background-color: #f0f2f5;
            padding: 6px 10px;
            border-radius: 16px;
            margin: 3px;
            font-size: 12px;
            font-weight: 500;
        }
        .game-tag .remove-btn {
            margin-left: 6px;
            cursor: pointer;
            color: #65676b;
        }
        .game-tag .remove-btn:hover {
            color: #000;
        }
        .add-more-btn {
            width: 100%;
            background-color: #f0f2f5;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .add-more-btn:hover {
            background-color: #e4e6eb;
        }
        .save-btn {
            width: 100%;
            background-color: #1878F3;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            position: fixed;
            bottom: 16px;
            left: 16px;
            right: 16px;
            max-width: calc(100% - 32px);
        }
        .save-btn:hover {
            background-color: #0d5ecf;
        }
        .games-container {
            padding-bottom: 80px;
        }
        .games-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
    </style>

</head>
<body class="max-w-md mx-auto min-h-screen pb-20">
    <!-- Add Games Page -->
    <div id="add-games-page" class="page active">
        <!-- Header -->
        <header class="p-4 flex items-center justify-between">
            <div class="flex items-center">
                <button class="text-2xl mr-4">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                <h1 class="text-2xl font-bold">Add games</h1>
            </div>
            <button id="done-btn" class="text-lg font-bold text-blue-600 hover:text-blue-700">
                Done
            </button>
        </header>

        <!-- Search Bar -->
        <div class="px-4 mb-6">
            <div class="search-container flex items-center px-4 py-2">
                <i class="fa-solid fa-magnifying-glass text-gray-500 mr-3"></i>
                <input 
                    type="text" 
                    id="search-input"
                    placeholder="Search games" 
                    class="bg-transparent border-none outline-none w-full text-lg placeholder-gray-500"
                >
            </div>
        </div>

        <!-- Content -->
        <div class="px-4">
            <div id="games-list" class="games-list"></div>
        </div>

        <!-- Selected Count Badge -->
        <div id="selected-count" class="selected-count">
            <span id="count-text">0 selected</span>
        </div>
    </div>

    <!-- Games Confirmation Page -->
    <div id="games-page" class="page">
        <!-- Header -->
        <header class="p-4 flex items-center justify-between">
            <button id="close-btn" class="text-2xl">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <h1 class="text-2xl font-bold">Games</h1>
            <div style="width: 24px;"></div>
        </header>

        <!-- Add More Button -->
        <div class="px-4 mb-6">
            <button id="add-more-btn" class="add-more-btn">
                <i class="fa-solid fa-plus"></i>
                Add more
            </button>
        </div>

        <!-- Games Display -->
        <div class="px-4 games-container" id="games-display">
            <!-- Selected games will be displayed here -->
        </div>

        <!-- Save Button -->
        <button id="save-btn" class="save-btn">Save</button>
    </div>

        // Initialize games
        allGames = gamesData;
        trendingGames = gamesData.slice(0, 11);
        renderGames(trendingGames);

        function updateSelectedCount() {
            if (selectedGames.size > 0) {
                countText.textContent = `${selectedGames.size} selected`;
                selectedCountBadge.classList.add('show');
            } else {
                selectedCountBadge.classList.remove('show');
            }
        }

        function toggleGame(gameName, button) {
            if (selectedGames.has(gameName)) {
                selectedGames.delete(gameName);
                button.classList.remove('active');
                button.innerHTML = '<i class="fa-solid fa-circle-plus"></i>';
            } else {
                selectedGames.add(gameName);
                button.classList.add('active');
                button.innerHTML = '<i class="fa-solid fa-circle-check"></i>';
            }
            updateSelectedCount();
        }

        const gameCoverFallback =
            "https://placehold.co/300x450/e4e6eb/65676b?text=No+Cover";

        function getGameCoverUrl(game) {
            const query = `${game.name} ${game.year} video game cover`;
            return (
                "https://tse1.mm.bing.net/th" +
                "?q=" + encodeURIComponent(query) +
                "&w=300&h=450&c=7&rs=1&p=0&dpr=2" +
                "&pid=1.7&mkt=en-US&adlt=moderate"
            );
        }

        function renderGames(games) {
            gamesList.innerHTML = '';
            games.forEach((game, index) => {
                const item = document.createElement('div');
                item.className = 'game-item';
                const isSelected = selectedGames.has(game.name);
                const buttonClass = isSelected ? 'add-btn active' : 'add-btn';
                const iconClass = isSelected ? 'fa-solid fa-circle-check' : 'fa-solid fa-circle-plus';
                
                item.innerHTML = `
                    <img
                        src="${getGameCoverUrl(game)}"
                        alt="${game.name} cover"
                        class="game-image"
                        loading="lazy"
                        referrerpolicy="no-referrer"
                        onerror="this.onerror=null;this.src=gameCoverFallback"
                    >
                    <div class="game-info">
                        <p class="game-title">${game.name}</p>
                        <p class="game-meta">${game.genre} · ${game.year}</p>
                    </div>
                    <button class="${buttonClass}">
                        <i class="${iconClass}"></i>
                    </button>
                `;
                
                const button = item.querySelector('button');
                button.addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleGame(game.name, button);
                });
                
                gamesList.appendChild(item);
            });
        }

        function displaySelectedGames() {
            gamesDisplay.innerHTML = '';
            selectedGames.forEach(game => {
                const tag = document.createElement('div');
                tag.className = 'game-tag';
                tag.innerHTML = `
                    ${game}
                    <span class="remove-btn">×</span>
                `;
                tag.querySelector('.remove-btn').addEventListener('click', () => {
                    selectedGames.delete(game);
                    displaySelectedGames();
                });
                gamesDisplay.appendChild(tag);
            });
        }

        function showPage(page) {
            addGamesPage.classList.remove('active');
            gamesPage.classList.remove('active');
            page.classList.add('active');
        }

        // Done button handler
        document.getElementById('done-btn').addEventListener('click', () => {
            if (selectedGames.size > 0) {
                displaySelectedGames();
                showPage(gamesPage);
            } else {
                alert('Please select at least one game');
            }
        });

        // Close button handler
        document.getElementById('close-btn').addEventListener('click', () => {
            showPage(addGamesPage);
        });

        // Add more button handler
        document.getElementById('add-more-btn').addEventListener('click', () => {
            showPage(addGamesPage);
        });

        // Save button handler
        document.getElementById('save-btn').addEventListener('click', () => {
            const gamesList = Array.from(selectedGames).join(', ');
            alert(`Games saved: ${gamesList}`);
        });

        // Search functionality
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            if (query === '') {
                renderGames(trendingGames);
            } else {
                const filtered = allGames.filter(game => 
                    game.name.toLowerCase().includes(query)
                );
                renderGames(filtered);
            }
        });
