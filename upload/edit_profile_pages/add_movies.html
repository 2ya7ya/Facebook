    <title>Add Movies</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
        }
        .search-container {
            background-color: #f0f2f5;
            border-radius: 20px;
        }
        .movie-item {
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
        }
        .movie-item:active {
            background-color: #f0f2f5;
        }
        .movie-image {
            width: 48px;
            height: 64px;
            border-radius: 6px;
            object-fit: cover;
            flex-shrink: 0;
            background-color: #e4e6eb;
        }
        .movie-info {
            flex: 1;
            min-width: 0;
        }
        .movie-title {
            font-size: 14px;
            font-weight: bold;
            margin: 0;
        }
        .movie-meta {
            font-size: 12px;
            color: #65676b;
            margin: 2px 0 0 0;
        }
        .add-btn {
            color: #9ca3af;
            font-size: 20px;
            cursor: pointer;
            transition: color 0.2s;
            border: none;
            background: none;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .add-btn:hover {
            color: #4b5563;
        }
        .add-btn.active {
            color: #0a66c2;
        }
        .selected-count {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #0a66c2;
            color: white;
            padding: 12px 16px;
            border-radius: 20px;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            display: none;
        }
        .selected-count.show {
            display: block;
        }
        .page {
            display: none;
        }
        .page.active {
            display: block;
        }
        .movie-tag {
            display: inline-block;
            background-color: #f0f2f5;
            padding: 6px 10px;
            border-radius: 16px;
            margin: 3px;
            font-size: 12px;
            font-weight: 500;
        }
        .movie-tag .remove-btn {
            margin-left: 6px;
            cursor: pointer;
            color: #65676b;
        }
        .movie-tag .remove-btn:hover {
            color: #000;
        }
        .add-more-btn {
            width: 100%;
            background-color: #f0f2f5;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .add-more-btn:hover {
            background-color: #e4e6eb;
        }
        .save-btn {
            width: 100%;
            background-color: #1878F3;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            position: fixed;
            bottom: 16px;
            left: 16px;
            right: 16px;
            max-width: calc(100% - 32px);
        }
        .save-btn:hover {
            background-color: #0d5ecf;
        }
        .movies-container {
            padding-bottom: 80px;
        }
        .movies-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
    </style>

</head>
<body class="max-w-md mx-auto min-h-screen pb-20">
    <!-- Add Movies Page -->
    <div id="add-movies-page" class="page active">
        <!-- Header -->
        <header class="p-4 flex items-center justify-between">
            <div class="flex items-center">
                <button class="text-2xl mr-4">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                <h1 class="text-2xl font-bold">Add movies</h1>
            </div>
            <button id="done-btn" class="text-lg font-bold text-blue-600 hover:text-blue-700">
                Done
            </button>
        </header>

        <!-- Search Bar -->
        <div class="px-4 mb-6">
            <div class="search-container flex items-center px-4 py-2">
                <i class="fa-solid fa-magnifying-glass text-gray-500 mr-3"></i>
                <input 
                    type="text" 
                    id="search-input"
                    placeholder="Search movies" 
                    class="bg-transparent border-none outline-none w-full text-lg placeholder-gray-500"
                >
            </div>
        </div>

        <!-- Content -->
        <div class="px-4">
            <div id="movies-list" class="movies-list"></div>
        </div>

        <!-- Selected Count Badge -->
        <div id="selected-count" class="selected-count">
            <span id="count-text">0 selected</span>
        </div>
    </div>

    <!-- Movies Confirmation Page -->
    <div id="movies-page" class="page">
        <!-- Header -->
        <header class="p-4 flex items-center justify-between">
            <button id="close-btn" class="text-2xl">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <h1 class="text-2xl font-bold">Movies</h1>
            <div style="width: 24px;"></div>
        </header>

        <!-- Add More Button -->
        <div class="px-4 mb-6">
            <button id="add-more-btn" class="add-more-btn">
                <i class="fa-solid fa-plus"></i>
                Add more
            </button>
        </div>

        <!-- Movies Display -->
        <div class="px-4 movies-container" id="movies-display">
            <!-- Selected movies will be displayed here -->
        </div>

        <!-- Save Button -->
        <button id="save-btn" class="save-btn">Save</button>
    </div>

        // Initialize movies
        allMovies = moviesData;
        trendingMovies = moviesData.slice(0, 11);

        function updateSelectedCount() {
            if (selectedMovies.size > 0) {
                countText.textContent = `${selectedMovies.size} selected`;
                selectedCountBadge.classList.add('show');
            } else {
                selectedCountBadge.classList.remove('show');
            }
        }

        function toggleMovie(movieName, button) {
            if (selectedMovies.has(movieName)) {
                selectedMovies.delete(movieName);
                button.classList.remove('active');
                button.innerHTML = '<i class="fa-solid fa-circle-plus"></i>';
            } else {
                selectedMovies.add(movieName);
                button.classList.add('active');
                button.innerHTML = '<i class="fa-solid fa-circle-check"></i>';
            }
            updateSelectedCount();
        }


        const moviePosterFallback =
            "https://placehold.co/300x450/e4e6eb/65676b?text=No+Poster";

        function getMoviePosterUrl(movie) {
            const query = `${movie.name} ${movie.year} official movie poster`;
            return (
                "https://tse1.mm.bing.net/th" +
                "?q=" + encodeURIComponent(query) +
                "&w=300&h=450&c=7&rs=1&p=0&dpr=2" +
                "&pid=1.7&mkt=en-US&adlt=moderate"
            );
        }

        function renderMovies(movies) {
            moviesList.innerHTML = '';
            movies.forEach((movie, index) => {
                const item = document.createElement('div');
                item.className = 'movie-item';
                const isSelected = selectedMovies.has(movie.name);
                const buttonClass = isSelected ? 'add-btn active' : 'add-btn';
                const iconClass = isSelected ? 'fa-solid fa-circle-check' : 'fa-solid fa-circle-plus';
                
                item.innerHTML = `
                    <img
                        src="${getMoviePosterUrl(movie)}"
                        alt="${movie.name} poster"
                        class="movie-image"
                        loading="lazy"
                        referrerpolicy="no-referrer"
                        onerror="this.onerror=null;this.src=moviePosterFallback"
                    >
                    <div class="movie-info">
                        <p class="movie-title">${movie.name}</p>
                        <p class="movie-meta">${movie.genre} · ${movie.year}</p>
                    </div>
                    <button class="${buttonClass}">
                        <i class="${iconClass}"></i>
                    </button>
                `;
                
                const button = item.querySelector('button');
                button.addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleMovie(movie.name, button);
                });
                
                moviesList.appendChild(item);
            });
        }

        // Render only after poster variables and renderMovies are initialized.
        renderMovies(trendingMovies);

        function displaySelectedMovies() {
            moviesDisplay.innerHTML = '';
            selectedMovies.forEach(movie => {
                const tag = document.createElement('div');
                tag.className = 'movie-tag';
                tag.innerHTML = `
                    ${movie}
                    <span class="remove-btn">×</span>
                `;
                tag.querySelector('.remove-btn').addEventListener('click', () => {
                    selectedMovies.delete(movie);
                    displaySelectedMovies();
                });
                moviesDisplay.appendChild(tag);
            });
        }

        function showPage(page) {
            addMoviesPage.classList.remove('active');
            moviesPage.classList.remove('active');
            page.classList.add('active');
        }

        // Done button handler
        document.getElementById('done-btn').addEventListener('click', () => {
            if (selectedMovies.size > 0) {
                displaySelectedMovies();
                showPage(moviesPage);
            } else {
                alert('Please select at least one movie');
            }
        });

        // Close button handler
        document.getElementById('close-btn').addEventListener('click', () => {
            showPage(addMoviesPage);
        });

        // Add more button handler
        document.getElementById('add-more-btn').addEventListener('click', () => {
            showPage(addMoviesPage);
        });

        // Save button handler
        document.getElementById('save-btn').addEventListener('click', () => {
            const moviesList = Array.from(selectedMovies).join(', ');
            alert(`Movies saved: ${moviesList}`);
        });

        // Search functionality
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            if (query === '') {
                renderMovies(trendingMovies);
            } else {
                const filtered = allMovies.filter(movie => 
                    movie.name.toLowerCase().includes(query)
                );
                renderMovies(filtered);
            }
        });
    </script>
