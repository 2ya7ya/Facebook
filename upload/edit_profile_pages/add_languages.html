    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Languages</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');
        
        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            color: #1c1e21;
            overflow: hidden;
        }

        /* Common Transitions */
        .screen {
            display: none;
            flex-direction: column;
            height: 100vh;
            width: 100%;
        }
        .screen.active {
            display: flex;
        }

        /* --- Languages Screen Styles --- */
        .header-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #050505;
        }
        .search-input-container {
            margin-top: 12px;
        }
        .main-search-input {
            border: 1px solid #ced0d4;
            border-radius: 10px;
            padding: 14px 16px;
            width: 100%;
            font-size: 1.1rem;
            color: #050505;
            background-color: #ffffff;
            cursor: pointer;
        }
        .main-search-input::placeholder {
            color: #65676b;
        }
        .save-button {
            background-color: #1877f2;
            color: #ffffff;
            font-weight: 600;
            border-radius: 8px;
            padding: 8px 12px;
            width: 100%;
            text-align: center;
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
            line-height: 1.2;
        }
        .save-button:active {
            background-color: #166fe5;
        }
        .sticky-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: white;
            padding: 12px 16px;
            border-top: 1px solid #f0f2f5;
            z-index: 10;
        }
        .scrollable-content {
            height: calc(100vh - 120px);
            overflow-y: auto;
            padding-bottom: 60px;
        }

        /* --- Add Languages Screen Styles --- */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 56px;
            padding: 0 16px;
            background: #fff;
            flex-shrink: 0;
        }
        .back-icon {
            width: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
        }
        .done-btn {
            font-size: 18px;
            font-weight: 500;
            color: #bcc0c4;
            cursor: not-allowed;
            transition: color 0.2s;
        }
        .done-btn.active {
            color: #1878F3;
            cursor: pointer;
        }
        .content {
            padding: 0 16px;
            flex-grow: 1;
            overflow-y: auto;
        }
        .page-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 16px;
            margin-top: 4px;
        }
        .search-container {
            position: relative;
            width: 100%;
            margin-bottom: 20px;
        }
        .add-search-input {
            width: 100%;
            height: 44px;
            padding: 0 16px 0 44px;
            font-size: 18px;
            color: #1c1e21;
            background-color: #f0f2f5;
            border: none;
            border-radius: 22px;
            outline: none;
        }
        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #65676b;
            width: 20px;
            height: 20px;
        }
        .results-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .result-item {
            padding: 14px 0;
            border-bottom: 1px solid #f0f2f5;
            display: flex;
            align-items: center;
            cursor: pointer;
        }
        .checkbox-mock {
            width: 20px;
            height: 20px;
            border: 2px solid #ced0d4;
            border-radius: 4px;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .result-item.selected .checkbox-mock {
            background-color: #1878F3;
            border-color: #1878F3;
        }
        .result-item.selected .checkbox-mock::after {
            content: '✓';
            color: white;
            font-size: 14px;
            font-weight: bold;
        }
        .result-name {
            font-size: 18px;
            font-weight: 400;
        }
    </style>

</head>

            <div class="flex-grow text-center">
                <h1 class="header-title">Languages</h1>
            </div>
            <div class="flex-none w-10"></div>
        </header>

        <main class="flex-grow px-4 scrollable-content">
            <div class="search-input-container">
                <input type="text" id="main-display-input" placeholder="Languages" class="main-search-input outline-none" readonly onclick="showAddScreen()">
            </div>
        </main>

        <footer class="sticky-footer">
            <button class="save-button" onclick="alert('Settings Saved!')">
                Save
            </button>
        </footer>
    </div>

    <!-- SCREEN 2: Add Languages -->
    <div id="screen-add" class="screen">
        <div class="header">
            <div class="back-icon" onclick="showMainScreen()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </div>
            <div class="done-btn" id="done-btn">Done</div>
        </div>

        <div class="content">
            <h1 class="page-title">Add languages</h1>
            
            <div class="search-container">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" class="add-search-input" placeholder="Search languages and dialects" id="lang-search" autocomplete="off">
            </div>

            <ul class="results-list" id="results-list">
                <!-- Results will appear here -->
            </ul>
        </div>
    </div>

    <script>
        const mainScreen = document.getElementById('screen-main');
        const addScreen = document.getElementById('screen-add');
        const mainDisplayInput = document.getElementById('main-display-input');
        const searchInput = document.getElementById('lang-search');
        const resultsList = document.getElementById('results-list');
        const doneBtn = document.getElementById('done-btn');

        const languages = ["English", "Spanish", "French", "German", "Chinese", "Japanese", "Korean", "Arabic", "Portuguese", "Russian", "Italian", "Turkish", "Hindi", "Bengali", "Vietnamese"];
        let selectedLanguages = new Set();

        function showAddScreen() {
            mainScreen.classList.remove('active');
            addScreen.classList.add('active');
            renderResults(""); // Show all or empty initially
        }

        function showMainScreen() {
            addScreen.classList.remove('active');
            mainScreen.classList.add('active');
        }

        function updateDoneButton() {
            if (selectedLanguages.size > 0) {
                doneBtn.classList.add('active');
            } else {
                doneBtn.classList.remove('active');
            }
        }

        function renderResults(query) {
            resultsList.innerHTML = '';
            const filtered = query.length > 0 
                ? languages.filter(lang => lang.toLowerCase().includes(query.toLowerCase()))
                : languages;

            filtered.forEach(lang => {
                const li = document.createElement('li');
                li.className = 'result-item';
                if (selectedLanguages.has(lang)) li.classList.add('selected');
                
                li.innerHTML = `
                    <div class="checkbox-mock"></div>
                    <span class="result-name">${lang}</span>
                `;
                
                li.onclick = () => {
                    if (selectedLanguages.has(lang)) {
                        selectedLanguages.delete(lang);
                        li.classList.remove('selected');
                    } else {
                        selectedLanguages.add(lang);
                        li.classList.add('selected');
                    }
                    updateDoneButton();
                };
                resultsList.appendChild(li);
            });
        }

        searchInput.addEventListener('input', (e) => {
            renderResults(e.target.value);
        });

        doneBtn.onclick = () => {
            if (selectedLanguages.size > 0) {
                const names = Array.from(selectedLanguages).join(', ');
                mainDisplayInput.value = names;
                showMainScreen();
            }
        };

        // Initialize
        renderResults("");
    </script>
