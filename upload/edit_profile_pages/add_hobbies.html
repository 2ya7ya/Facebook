<!DOCTYPE html>
<html lang="en">
<head><script>window.alert=function(){};</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Add Hobbies</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;min-height:100%;background:#fff;color:#050505;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{max-width:420px;margin:0 auto;overflow-x:hidden}
.page{display:none;min-height:100vh;background:#fff}
.page.active{display:block}
.header{height:56px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;background:#fff;position:sticky;top:0;z-index:10}
.header-left{display:flex;align-items:center;min-width:0}
.back-btn{width:32px;height:32px;min-width:32px;margin:0 12px 0 0;padding:0;border:0;background:transparent;display:flex;align-items:center;justify-content:center;color:#050505;cursor:pointer}
.back-btn svg{width:20px;height:20px;display:block;stroke:currentColor;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.title{font-size:24px;line-height:32px;font-weight:700;margin:0;color:#050505;white-space:nowrap}
.done-btn{border:0;background:transparent;padding:0;margin:0;color:#1877f2;font-size:18px;font-weight:700;line-height:24px;min-width:54px;text-align:right;cursor:pointer}
.done-btn:disabled,.done-btn.merged-disabled{color:#bcc0c4!important;opacity:1!important;pointer-events:none!important;cursor:default!important}
.search-wrap{padding:0 16px 22px}
.search-box{height:42px;border-radius:21px;background:#f0f2f5;display:flex;align-items:center;padding:0 14px}
.search-icon{width:18px;height:18px;margin-right:10px;opacity:.62;flex:0 0 auto}
#search-input{border:0;outline:0;background:transparent;width:100%;font-size:17px;color:#050505;padding:0}
#search-input::placeholder{color:#65676b}
.content{padding:0 16px 24px}
#section-title{font-size:20px;line-height:26px;margin:0 0 14px;font-weight:700;color:#050505}
#hobbies-list{display:flex;flex-direction:column;gap:17px;padding-bottom:24px}
.hobby-item{display:flex;align-items:center;justify-content:space-between;min-height:54px;gap:12px}
.hobby-main{display:flex;align-items:center;min-width:0;gap:10px;flex:1}
.hobby-image{width:48px;height:48px;border-radius:8px;object-fit:cover;flex:0 0 48px;background:#e4e6eb}
.hobby-info{min-width:0;flex:1}
.hobby-name{font-size:16px;line-height:21px;font-weight:700;color:#050505}
.hobby-count{font-size:12px;line-height:16px;color:#65676b;margin-top:2px}
.add-btn{width:30px;height:30px;border:0;background:transparent;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;color:#1877f2;cursor:pointer;flex:0 0 30px}
.add-btn svg{width:28px;height:28px;display:block}
.add-btn.active svg{width:28px;height:28px}
.selected-count{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(18px);background:#1877f2;color:white;border-radius:22px;padding:9px 16px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
.selected-count.show{opacity:1;transform:translateX(-50%) translateY(0)}
.confirm-header{height:56px;padding:0 16px;display:flex;align-items:center;justify-content:center;position:relative;background:#fff}
.close-icon{position:absolute;left:16px;top:8px;width:40px;height:40px;border:0;background:transparent;font-size:28px;font-weight:300;line-height:40px;color:#1c1e21;text-align:left;padding:0;cursor:pointer}
.confirm-title{font-size:24px;font-weight:700;line-height:32px;margin:0;color:#050505}
.add-more-btn{margin:16px 16px 18px;width:calc(100% - 32px);height:44px;border:0;border-radius:8px;background:#F1F2F6;color:#2F2F31;font-size:16px;font-weight:700;cursor:pointer}
.hobbies-container{padding:0 16px 90px;display:flex;flex-wrap:wrap;gap:10px}
.hobby-tag{display:inline-flex;align-items:center;gap:8px;border-radius:18px;background:#F1F2F6;color:#2F2F31;padding:8px 12px;font-size:15px;font-weight:600}
.remove-btn{font-size:18px;line-height:1;cursor:pointer;color:#2F2F31}
.save-btn{position:fixed;left:16px;right:16px;bottom:16px;height:46px;border:0;border-radius:8px;background:#1877f2;color:#fff;font-size:17px;font-weight:700;cursor:pointer}
.no-results{font-size:15px;color:#65676b;padding:8px 0}
</style>
<style>
#hobbies-page .add-more-btn,#hobbies-page .hobby-tag,#hobbies-page .remove-btn{color:#2F2F31!important;}
</style>

</head>
<body>
<div id="add-hobbies-page" class="page active">
  <header class="header">
    <div class="header-left">
      <button class="back-btn" id="back-btn" aria-label="Back" type="button"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
      <h1 class="title">Add hobbies</h1>
    </div>
    <button id="done-btn" class="done-btn merged-disabled" disabled aria-disabled="true" type="button">Done</button>
  </header>
  <div class="search-wrap">
    <div class="search-box">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="text" id="search-input" placeholder="Search activities you enjoy" autocomplete="off">
    </div>
  </div>
  <main class="content">
    <h2 id="section-title">Popular hobbies</h2>
    <div id="hobbies-list"></div>
  </main>
  <div id="selected-count" class="selected-count"><span id="count-text">0 selected</span></div>
</div>

<div id="hobbies-page" class="page">
  <header class="confirm-header">
    <button id="close-btn" class="close-icon" aria-label="Close" type="button">&times;</button>
    <h1 class="confirm-title">Hobbies</h1>
  </header>
  <button id="add-more-btn" class="add-more-btn" type="button">+ Add more</button>
  <div class="hobbies-container" id="hobbies-display"></div>
  <button id="save-btn" class="save-btn" type="button">Save</button>
</div>

<script>
(function(){
  const HOBBIES = ["Listening to Music", "Traveling", "Reading", "Cooking", "Photography", "Video Games", "Cricket", "Painting", "Gardening", "Hiking", "Dancing", "Writing", "Cycling", "Swimming", "Yoga", "Fishing", "Camping", "Surfing", "Baking", "Chess", "Knitting", "Pottery", "Running", "Meditation", "Astronomy", "Bird Watching", "Woodworking", "Gaming", "Singing", "Acting", "Calligraphy", "Origami", "Sculpting", "Drawing", "Graphic Design", "Coding", "Vlogging", "Podcasting", "Board Games", "Magic Tricks", "Stamp Collecting", "Stargazing", "Scuba Diving", "Skydiving", "Rock Climbing", "Skateboarding", "Ice Skating", "Skiing", "Snowboarding", "Tennis", "Basketball", "Soccer", "Baseball", "Volleyball", "Golf", "Bowling", "Billiards", "Darts", "Archery", "Fencing", "Martial Arts", "Boxing", "Wrestling", "Weightlifting", "Gymnastics", "Horseback Riding", "Sailing", "Kayaking", "Canoeing", "Rowing", "Rollerblading", "Parkour", "Urban Exploration", "Geocaching", "Metal Detecting", "Antiquing", "Thrifting", "Fashion", "Makeup", "Hair Styling", "Nail Art", "Cosplay", "Model Building", "LEGO Building", "Puzzle Solving", "Sudoku", "Crossword Puzzles", "Rubik's Cube", "Card Games", "Poker", "Mahjong", "Bridge", "Dominoes", "Backgammon", "Table Tennis", "Badminton", "Squash", "Pickleball", "Handball", "Rugby", "American Football", "Lacrosse", "Field Hockey", "Ice Hockey", "Curling", "Cross-country Skiing", "Figure Skating", "Speed Skating", "Alpine Skiing", "Arabic Calligraphy", "Art", "Arts and Crafts", "Beach Walks", "Beauty", "Blogging", "Book Clubs", "Candle Making", "Car Photography", "Ceramics", "Content Creation", "Crochet", "Digital Art", "DIY Projects", "Embroidery", "Event Planning", "Film Photography", "Fitness", "Food Photography", "Football", "Henna Art", "Interior Design", "Jewelry Making", "Journaling", "Landscape Photography", "Language Learning", "Makeup Artistry", "Minimalism", "Mobile Photography", "Photo Editing", "Photoshoots", "Pilates", "Poetry", "Portrait Photography", "Reels Making", "Shopping", "Skin Care", "Social Media", "Street Photography", "Travel Photography", "Video Editing", "Wedding Photography", "Zumba", "Aerobics", "Animal Care", "Aquascaping", "Ballet", "Basket Weaving", "Beadwork", "Beatboxing", "Belly Dancing", "Bicycle Repair", "Book Collecting", "Botany", "Cafe Hopping", "Cake Decorating", "Candle Collecting", "Car Restoration", "Ceramic Painting", "Choir", "Classic Movies", "Collecting", "Comedy", "Concerts", "Creative Writing", "Cultural Events", "Decoupage", "Dog Training", "Drama", "Dress Design", "Drone Photography", "Fashion Design", "Flower Arranging", "Food Blogging", "Furniture Upcycling", "Genealogy", "Glass Painting", "Hand Lettering", "Home Decorating", "Home Workouts", "Illustration", "Jewelry Design", "Karaoke", "Kickboxing", "Landscape Design", "Latte Art", "Learning Languages", "Macrame", "Miniature Art", "Museum Visits", "Nature Walks", "Needlepoint", "Online Courses", "Paper Crafts", "Perfume Making", "Pet Care", "Photo Albums", "Picnics", "Playing Guitar", "Playing Piano", "Playing Oud", "Playing Violin", "Resin Art", "Scrapbooking", "Sewing", "Soap Making", "Storytelling", "Studying", "Tea Tasting", "Theater", "Traditional Food", "Volunteering", "Walking", "Watercolor Painting", "Web Design", "Quran Recitation", "Nasheed", "Dabke", "Traditional Embroidery", "Tatreez", "Cooking Traditional Food", "Dessert Making", "Coffee Making", "Learning English", "Learning Turkish", "Learning French", "Public Speaking", "Planning Events", "Decorating", "Flower Design", "Bridal Photography", "Family Photography", "Newborn Photography", "Portrait Editing", "Canva Design", "CapCut Editing", "Instagram Reels", "TikTok Content", "Makeup Tutorials", "Fashion Styling", "Room Decor", "Minimalist Design", "Beach Photography", "Sunset Watching", "Nature Photography", "Picnic Planning", "Handmade Gifts", "Gift Wrapping", "Candle Design", "Clay Art", "Sketching", "Charcoal Drawing", "Oil Painting", "Acrylic Painting", "Watercolor Art", "Reading Novels", "Reading Poetry", "Reading History", "Watching Movies", "Watching TV Shows", "Documentaries", "Anime", "Manga", "Korean Dramas", "Turkish Series", "Music Discovery", "Singing Covers", "Voice Acting", "Piano Practice", "Guitar Practice", "Oud Practice", "Violin Practice", "Choir Singing", "Swimming at the Beach", "Walking on the Beach", "Home Baking", "Cake Design", "Cupcake Decorating", "Chocolate Making", "Healthy Cooking", "Meal Prep", "Home Organization", "Cleaning Hacks", "Gardening at Home", "Plant Care", "Succulents", "Bird Care", "Cat Care", "Dog Care", "Aquarium Keeping", "Collecting Perfumes", "Collecting Books", "Collecting Coins", "Collecting Photos", "Scrapbook Journaling", "Memory Keeping", "Hand Crafts", "Leather Craft", "Wood Burning", "Mosaic Art", "Origami Flowers", "Paper Flowers", "Balloon Decoration", "Party Planning", "Wedding Planning", "Stage Decoration", "Lighting Design", "Sound Mixing", "Photo Printing", "Album Design", "Retouching", "Color Grading", "Mobile Filmmaking", "Short Films", "Script Writing", "Story Writing", "Translation", "Subtitling", "Teaching", "Tutoring", "Studying Literature", "History Reading", "Civilization Studies", "Volunteering with Children", "Charity Work", "Community Work", "First Aid Learning", "Fitness Walks", "Stretching", "Home Yoga", "Strength Training", "Dance Workouts", "Skipping Rope", "Ping Pong", "Chess Puzzles", "Logic Puzzles", "Word Games", "Language Exchange", "Travel Planning", "Map Exploring", "Learning Cultures", "Beach Cleanup", "Environmental Care"];
  const selectedHobbies = window.selectedHobbies = new Set();
  const list = document.getElementById('hobbies-list');
  const search = document.getElementById('search-input');
  const title = document.getElementById('section-title');
  const done = document.getElementById('done-btn');
  const badge = document.getElementById('selected-count');
  const countText = document.getElementById('count-text');
  const addPage = document.getElementById('add-hobbies-page');
  const confirmPage = document.getElementById('hobbies-page');
  const display = document.getElementById('hobbies-display');
  function escapeHTML(v){return String(v).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
  function countFor(i){return (10 - (i % 9)) + '.' + (i % 10) + 'K';}
  const hobbyImageFallback = 'https://placehold.co/300x300/e4e6eb/65676b?text=Hobby';
  function getHobbyImageUrl(name){
    const query = String(name || '') + ' hobby activity';
    return 'https://tse1.mm.bing.net/th'
      + '?q=' + encodeURIComponent(query)
      + '&w=300&h=300&c=7&rs=1&p=0&dpr=2'
      + '&pid=1.7&mkt=en-US&adlt=moderate';
  }
  function setDone(){
    const enabled = selectedHobbies.size > 0;
    done.disabled = !enabled;
    done.classList.toggle('merged-disabled', !enabled);
    done.setAttribute('aria-disabled', enabled ? 'false' : 'true');
    countText.textContent = selectedHobbies.size + ' selected';
    badge.classList.toggle('show', enabled);
  }
  window.updateSelectedCount = setDone;
  function icon(active){
    return active
      ? '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#1877f2"></circle><path d="M7 12.3l3.1 3.1L17.4 8" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"></path></svg>'
      : '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#1877f2"></circle><path d="M12 7v10M7 12h10" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"></path></svg>';
  }
  function render(q){
    const query = String(q || '').trim().toLowerCase();
    title.textContent = query ? 'Search results' : 'Popular hobbies';
    let rows = HOBBIES.filter(name => !query || name.toLowerCase().includes(query));
    if(query && rows.length === 0){
      const custom = String(q || '').trim().replace(/\s+/g,' ');
      rows = custom ? [custom] : [];
    }
    list.innerHTML = rows.map((name, i) => {
      const active = selectedHobbies.has(name);
      return '<div class="hobby-item" data-hobby="'+escapeHTML(name)+'">'
        + '<div class="hobby-main">'
        + '<img src="'+escapeHTML(getHobbyImageUrl(name))+'" alt="'+escapeHTML(name)+'" class="hobby-image" loading="lazy" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src=\''+hobbyImageFallback+'\'">'
        + '<div class="hobby-info"><div class="hobby-name">'+escapeHTML(name)+'</div><div class="hobby-count">Added by '+countFor(i)+' others</div></div>'
        + '</div>'
        + '<button class="add-btn'+(active?' active':'')+'" type="button" aria-pressed="'+(active?'true':'false')+'">'+icon(active)+'</button>'
        + '</div>';
    }).join('') || '<div class="no-results">No hobbies found</div>';
    setDone();
  }
  function renderConfirm(){
    display.innerHTML = Array.from(selectedHobbies).map(name => '<span class="hobby-tag">'+escapeHTML(name)+'<span class="remove-btn" data-remove="'+escapeHTML(name)+'">×</span></span>').join('');
  }
  function showAdd(){confirmPage.classList.remove('active'); addPage.classList.add('active'); render(search.value);}
  function showConfirm(){renderConfirm(); addPage.classList.remove('active'); confirmPage.classList.add('active');}
  list.addEventListener('click', function(e){
    const btn = e.target.closest('.add-btn');
    if(!btn) return;
    const row = btn.closest('[data-hobby]');
    const name = row && row.getAttribute('data-hobby');
    if(!name) return;
    if(selectedHobbies.has(name)) selectedHobbies.delete(name); else selectedHobbies.add(name);
    render(search.value);
  });
  search.addEventListener('input', function(){render(search.value);});
  done.addEventListener('click', function(e){
    setDone();
    if(done.disabled){e.preventDefault();return;}
    showConfirm();
  });
  document.getElementById('back-btn').addEventListener('click', function(e){
    e.preventDefault();
    if(window.parent && window.parent.openPage) window.parent.openPage('edit_profile.html', false);
  });
  document.getElementById('close-btn').addEventListener('click', function(){showAdd();});
  document.getElementById('add-more-btn').addEventListener('click', function(){showAdd();});
  display.addEventListener('click', function(e){
    const r = e.target.getAttribute('data-remove');
    if(!r) return;
    selectedHobbies.delete(r);
    renderConfirm();
    render(search.value);
  });
  document.getElementById('save-btn').addEventListener('click', function(e){
    try{
      const all = JSON.parse(localStorage.getItem('mergedProfileData') || '{}');
      all['add_hobbies.html'] = {values:Array.from(selectedHobbies), updatedAt:Date.now()};
      localStorage.setItem('mergedProfileData', JSON.stringify(all));
    }catch(err){}
    e.preventDefault();
    if(window.parent && window.parent.openPage) window.parent.openPage('edit_profile.html', false);
  });
  render('');
  setDone();
})();
</script>
</body>
</html>
